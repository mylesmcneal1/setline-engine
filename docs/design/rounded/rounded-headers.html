<!DOCTYPE html><html><head><meta charset="utf-8"><title>Rounded headers (mockup)</title><style>
body{background:#0b0b0c;font:13px Inter,system-ui,sans-serif;padding:30px;margin:0}
.w{background:#0d0d0e;border-radius:12px;padding:10px;color:#f2f2f4;font-size:13px;max-width:900px}
.sh{display:flex;align-items:center;gap:10px;background:#1c1c1e;border-radius:10px;padding:10px 12px;margin-bottom:8px;overflow:hidden;position:relative}
.sh:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#22c3a6}
.sh b{font-size:17px;margin-left:4px}.sh span{color:#8e8e96;font-size:12px}
.row{display:grid;grid-template-columns:300px minmax(0,1fr);gap:6px;margin-bottom:5px;height:46px}
.hd{background:#1c1c1e;border-radius:9px;display:flex;align-items:center;gap:8px;padding-right:10px;overflow:hidden}
.tab{width:5px;align-self:stretch}.nm{flex:1}
.out{font-size:11px;color:#c9c9cf;background:#2a2a2e;border-radius:5px;padding:3px 7px}
.fad{width:40px;height:3px;border-radius:2px;background:#3a3a3e;position:relative}.fad i{position:absolute;left:0;top:0;bottom:0;width:70%;background:#d8d8dc;border-radius:2px}
.ms{display:flex;gap:3px}.ms b{font-size:10px;width:19px;height:18px;border-radius:5px;background:#2c2c30;color:#a1a1a8;display:flex;align-items:center;justify-content:center;font-weight:600}
.mtr{width:4px;height:24px;border-radius:2px;background:#2a2a2e;position:relative;overflow:hidden}.mtr i{position:absolute;left:0;right:0;bottom:0;background:#30d158}
.ln{background:#141415;border-radius:9px;position:relative;overflow:hidden}.clip{position:absolute;top:5px;bottom:5px;left:5px;right:30%;border-radius:6px}
</style></head><body><div class="w">
<div class="sh"><b>Glasshouse</b><span style="background:#2a2a2e;border-radius:6px;padding:2px 8px;color:#d6d6dc">With intro ▾</span><span style="font-family:monospace">92 BPM · 4/4 · F♯ · 3:48</span></div>
<div class="row"><div class="hd"><span class="tab" style="background:#c9cdd4"></span><span class="nm">Click</span><span class="out">Click IEM ▾</span><span class="fad"><i></i></span><span class="ms"><b>M</b><b>S</b></span><span class="mtr"><i style="height:55%"></i></span></div><div class="ln"><div class="clip" style="background:rgba(201,205,212,.14);right:5px"></div></div></div>
<div class="row"><div class="hd"><span class="tab" style="background:#ff6b6b"></span><span class="nm">Drums</span><span class="out">FOH L/R ▾</span><span class="fad"><i></i></span><span class="ms"><b>M</b><b>S</b></span><span class="mtr"><i style="height:80%"></i></span></div><div class="ln"><div class="clip" style="background:rgba(255,107,107,.22);border:1px solid rgba(255,107,107,.45)"></div></div></div>
<div class="row"><div class="hd"><span class="tab" style="background:#ff9f43"></span><span class="nm">Bass</span><span class="out">FOH L/R ▾</span><span class="fad"><i></i></span><span class="ms"><b>M</b><b>S</b></span><span class="mtr"><i style="height:65%"></i></span></div><div class="ln"><div class="clip" style="background:rgba(255,159,67,.22);border:1px solid rgba(255,159,67,.45)"></div></div></div>
<div class="row"><div class="hd"><span class="tab" style="background:#5aa9ff"></span><span class="nm">Guitar rig</span><span class="out">USB MIDI · Ch 1 ▾</span><span class="ms"><b>M</b></span></div><div class="ln"><div class="clip" style="background:rgba(90,169,255,.16);border:1px solid rgba(90,169,255,.4)"></div></div></div>
</div></body></html>
