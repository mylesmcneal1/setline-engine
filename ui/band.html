<!DOCTYPE html>
<html lang="en" style="background:#000">
<head>
<meta charset="utf-8">
<title>set.Line Remote</title>
<!-- 15 §7: a full-screen app from the home screen: no Safari bars, no zoom, dark from the first frame -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="set.Line">
<meta name="application-name" content="set.Line">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<!-- the set.Line app icon (the same artwork as the Mac and Windows app: assets/brand/setline-icon.svg) -->
<link rel="apple-touch-icon" sizes="180x180" href="./remote/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./remote/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./remote/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<!-- set.Line remote screens (6g): served by set.Line itself (http://<this computer>:8080/), opened on the band's
     phones and tablets. Each shows one screen's layout from the Remote page; its buttons can only do what they do.
     The widgets' own look is in src/band/widgets.js (shared with the Remote page's editor). -->
<style>
  html,body{margin:0;height:100%;background:#000;color:#f2f2f4;font:15px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  body{position:fixed;inset:0}
  *{box-sizing:border-box}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  /* the status line: its own line at the top (inside the safe area), the widgets start under it */
  #stat{position:fixed;left:0;right:0;top:env(safe-area-inset-top);height:28px;display:none;align-items:center;justify-content:center;gap:8px;z-index:5;padding:0 10px}
  body.stat #stat{display:flex}
  #stat .pc{padding:3px 10px;border-radius:9px;border:1px solid #ff453a;background:rgba(255,69,58,.16);color:#ff8a82;font:600 12.5px system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  #grid{position:fixed;top:calc(env(safe-area-inset-top) + 4px);right:calc(env(safe-area-inset-right) + 4px);bottom:calc(env(safe-area-inset-bottom) + 4px);left:calc(env(safe-area-inset-left) + 4px);overflow:hidden}
  body.stat #grid{top:calc(env(safe-area-inset-top) + 32px)}
  #grid.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #gridIn{position:relative;width:100%;height:100%}
  #ovl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(0,0,0,.72);z-index:20;text-align:center;padding:24px}
  #ovl.show{display:flex} #ovl h1{font-size:28px;margin:0} #ovl p{color:#8e8e96;margin:0}
  #count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);z-index:15;font:800 40vmin/1 -apple-system,sans-serif;color:#ff9f0a} #count.show{display:flex}
  .pick{display:flex;flex-direction:column;gap:8px;width:min(420px,90vw)} .pick button{padding:14px;border-radius:12px;background:#1c1c1e;font-size:17px;font-weight:600;display:flex;align-items:center;gap:12px}
  .pick input{padding:12px;border-radius:10px;border:0;background:#2a2a2e;color:#f2f2f4;font-size:16px}
  .av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#000;font-size:11px;font-weight:800}
  #tip{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);background:#1c1c1e;color:#f2f2f4;padding:10px 14px;border-radius:10px;font-size:13px;z-index:30;display:none;max-width:92vw} #tip.show{display:block}
</style>
<link rel="stylesheet" href="./src/fonts.css">
</head>
<body>
<div id="stat"></div>
<div id="grid" class="slw"><div id="gridIn"></div></div>
<div id="count"></div>
<div id="ovl"></div>
<div id="tip"></div>
<script type="module" src="./src/band/client.ts"></script>
</body>
</html>
