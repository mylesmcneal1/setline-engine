<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>set.Line — Edit (mockup)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./src/fonts.css"><script type="module" src="./src/bridge.ts"></script><script type="module" src="./src/pages/arrange.ts"></script>
<style>
  :root{
    --bg:#0b0c0e; --s1:#111317; --s2:#171a1f; --s3:#1e2228; --hair:#22262d;
    --text:#e9ebef; --muted:#8a909b; --faint:#555b66;
    --accent:#f5a524; --green:#3ddc84; --red:#ff5468; --blue:#5aa9ff; --cyan:#45c8d6;
    --s-intro:#6b7cff; --s-verse:#22c3a6; --s-pre:#a46bff; --s-chorus:#f5a524; --s-bridge:#ff5fa2; --s-outro:#7d8696; --s-turn:#45c8d6;
    --mono: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --code: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --head:300px; --th:48px; --r:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:13px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;display:grid;grid-template-rows:54px 1fr;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--hair);border-radius:5px;padding:4px 7px;outline:none}
  input:focus,select:focus{border-color:var(--faint)}
  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  ::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:#22262d;border-radius:10px;border:2px solid var(--bg)} ::-webkit-scrollbar-corner{background:transparent}

  /* ---------- top bar ---------- */
  .top{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--s1);border-bottom:1px solid var(--hair)}
  .brand{font-weight:650;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
  .brand i{width:9px;height:9px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
  .ibtn{width:28px;height:28px;border-radius:var(--r);display:grid;place-items:center;color:var(--muted)}
  .ibtn:hover{background:var(--s2);color:var(--text)}
  .ibtn.on{color:var(--text)}
  .ibtn svg{width:16px;height:16px}
  .tabs{display:flex;gap:2px;margin-left:6px}
  .tabs a{padding:6px 11px;border-radius:var(--r);color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
  .tabs a:hover{color:var(--text)}
  .tabs a.on{background:var(--s2);color:var(--text)}
  .transport{margin-left:auto;display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:8px;padding:3px}
  .tb{width:32px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
  .tb svg{width:15px;height:15px}
  .tb:hover{background:var(--s2);color:var(--text)}
  .tb.play.on{color:var(--green);background:rgba(61,220,132,.12)}
  .tb.on{color:var(--accent);background:rgba(245,165,36,.12)}
  .lcd{display:flex;align-items:stretch;height:42px;border-radius:8px;background:#07080a;border:1px solid #1b1e24;font-family:var(--code);overflow:hidden}
  .lcd>div{display:flex;flex-direction:column;justify-content:center;padding:0 14px;border-left:1px solid #16191e}
  .lcd>div:first-child{border-left:0}
  .lcd b{font-weight:500;font-size:13px;color:#e9ebef;white-space:nowrap}
  .lcd span{font-size:9.5px;color:var(--faint);letter-spacing:.06em;margin-top:1px;white-space:nowrap}
  .lcd .lpos{min-width:148px}
  .lcd .lpos b{font-size:19px;letter-spacing:.02em;color:#fff}
  .lcd .lpos span{font-size:11px;letter-spacing:0;color:var(--muted)}
  .lcd .lsong{min-width:150px;max-width:200px;font-family:Inter,system-ui,sans-serif}
  .lcd .lsong b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .lcd .lsong span{letter-spacing:0;font-size:11px;overflow:hidden;text-overflow:ellipsis}
  .status{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;white-space:nowrap}
  .omt{display:flex;flex-direction:column;gap:2px;width:64px}
  .omt i{position:relative;display:block;height:4px;border-radius:1px;background:linear-gradient(to right,#3ddc84 0 66%,#d7e04a 66% 86%,#ff5468 86%);overflow:hidden}
  .omt i b{position:absolute;top:0;right:0;bottom:0;width:100%;background:#1b1e24}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}

  .main{display:grid;grid-template-columns:var(--lw,260px) minmax(0,1fr) var(--rw,290px);min-height:0;transition:grid-template-columns .18s ease}
  body.l-closed .main{--lw:0px} body.r-closed .main{--rw:0px}
  .side,.insp{background:var(--s1);min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .side{border-right:1px solid var(--hair)} .insp{border-left:1px solid var(--hair)}
  body.l-closed .side,body.r-closed .insp{border:0}
  .phead{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 14px;flex:none}
  .phead h2{font-size:13px;font-weight:600}
  .phead .sp{margin-left:auto;display:flex;gap:2px}

  /* ---------- setlist ---------- */
  .setsel{background:transparent;border:0;font-weight:600;font-size:13px;padding:0;cursor:pointer}
  .songs{overflow:auto;flex:1;padding:0 6px}
  .song{display:grid;grid-template-columns:22px 1fr auto;gap:0 8px;padding:7px 8px;border-radius:var(--r);cursor:grab;align-items:baseline}
  .song:hover{background:var(--s2)}
  .song.on{background:var(--s3)}
  .song.dragging{opacity:.35}
  .song.over{box-shadow:inset 0 2px 0 var(--accent)}
  .song .n{color:var(--faint);font:11px var(--mono)}
  .song .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .song .d{color:var(--muted);font:11px var(--mono)}
  .vsel{background:transparent;border:1px solid transparent;color:var(--muted);font-size:11px;padding:1px 4px;border-radius:5px;max-width:110px;cursor:pointer;flex:none}
  .vsel:hover{border-color:var(--hair);color:var(--text)} .vsel.multi{color:var(--cyan)}
  .song .vrow{grid-column:2/4;margin:2px 0 0 -4px}
  .asel{background:transparent;border:0;color:var(--blue);font-size:10.5px;padding:0;max-width:140px;cursor:pointer}
  .verlist .vr{display:flex;align-items:center;gap:6px;padding:3px 0} .verlist .vr input{flex:1;min-width:0;font-size:12px;padding:3px 6px;background:transparent;border-color:transparent} .verlist .vr input:hover,.verlist .vr input:focus{border-color:var(--hair);background:var(--bg)}
  .verlist .vr .dot2{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--faint);cursor:pointer;flex:none} .verlist .vr.on .dot2{border-color:var(--cyan);background:radial-gradient(var(--cyan) 45%,transparent 50%)}
  .song .m{grid-column:2/4;color:var(--faint);font-size:11px;font-family:var(--mono)}
  .tr{display:flex;align-items:center;gap:6px;height:16px;padding-left:38px;font-size:10px;color:var(--faint);cursor:pointer;user-select:none}
  .tr:hover{color:var(--muted)}
  .tr i{font-style:normal;width:12px;text-align:center}
  .tr.segue i{color:var(--green)} .tr.stop i{color:var(--red)} .tr.auto i{color:var(--blue)}
  .songs.dropzone{background:rgba(245,165,36,.04)}
  details.pool{flex:none;border-top:1px solid var(--hair);padding:4px 6px 6px;max-height:40%;overflow:auto}
  details.pool summary{list-style:none;cursor:pointer;padding:8px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}
  details.pool summary::-webkit-details-marker{display:none}
  details.pool summary::after{content:"›";transition:transform .15s}
  details.pool[open] summary::after{transform:rotate(90deg)}
  .ps{display:flex;justify-content:space-between;padding:5px 8px;border-radius:var(--r);font-size:12px;color:var(--muted);cursor:grab}
  .ps:hover{background:var(--s2);color:var(--text)}
  .ps span:last-child{font:11px var(--mono);color:var(--faint)}
  .setfoot{flex:none;display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--hair);color:var(--muted);font-size:12px}
  .setfoot b{font:500 12px var(--mono);color:var(--text)}

  /* ---------- edit area ---------- */
  .edit{overflow:hidden;display:grid;grid-template-rows:44px auto 1fr auto auto auto;min-width:0;min-height:0}
  .etool{display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;border-bottom:1px solid var(--hair)}
  .etool h1{font-size:13px;font-weight:600}
  .etool .sp{margin-left:auto;display:flex;align-items:center;gap:4px}
  .btn{height:28px;padding:0 10px;border-radius:var(--r);color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:var(--s2);color:var(--text)}
  .btn.pri{background:var(--accent);color:#1b1200;font-weight:600}
  .btn.pri:hover{filter:brightness(1.08)}
  .btn.line{border:1px solid var(--hair)}
  .btn.danger:hover{color:var(--red)}
  .scroller{overflow:auto;min-height:0;position:relative;background:#0d0f12}
  .tools{display:flex;gap:2px;background:var(--bg);border-radius:7px;padding:2px;margin-left:8px}
  .tl{width:28px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
  .tl svg{width:14px;height:14px}
  .tl:hover{color:var(--text)} .tl.on{background:var(--s3);color:var(--text)}
  .zoom{display:flex;align-items:center;gap:4px;color:var(--muted);margin-left:6px}
  .gridc{align-items:center;margin-left:6px} .gridc select{height:24px;background:transparent;border:0;color:var(--muted);font:inherit;font-size:12px;padding:0 4px;border-radius:6px;cursor:pointer}
  .gridc select:hover{background:#1d2126;color:var(--text)} .gridc .ib2.on{color:var(--cyan)}
  .zoom button{width:22px;height:22px;border-radius:4px;color:var(--muted)} .zoom button:hover{background:var(--s2);color:var(--text)}
  .zoom input{-webkit-appearance:none;appearance:none;width:90px;height:14px;background:transparent;border:0;padding:0}
  .zoom input::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:#2a2f37}
  .zoom input::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#c9cdd4;margin-top:-3.5px}
  .btn.on{background:var(--s3);color:var(--text)}
  .vsep{width:1px;height:18px;background:var(--hair);margin:0 4px}

  .folder{position:relative;width:max-content;min-width:100%;border-bottom:1px solid #050607}
  .fhead{position:sticky;top:0;z-index:8;display:grid;grid-template-columns:var(--head) auto;height:40px;background:#101216;border-bottom:1px solid #050607}
  .fh{position:sticky;left:0;z-index:2;display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;background:var(--s2);border-right:1px solid #050607;cursor:pointer;white-space:nowrap;user-select:none}
  .fh:hover{background:var(--s3)}
  .folder.sel .fh{box-shadow:inset 3px 0 0 var(--accent)}
  .chev{width:12px;color:var(--faint);transition:transform .15s;font-size:10px;text-align:center}
  .folder.open .chev{transform:rotate(90deg)}
  .fh svg{width:15px;height:15px;flex:none}
  .fh .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .fh .num{font:11px var(--mono);color:var(--faint);min-width:26px;text-align:right}
  .fh .num.in{color:var(--accent)}
  .fh .chg{color:var(--cyan);font-size:12px}
  .fhead .lane{height:39px}
  .freg{position:absolute;top:5px;bottom:5px;left:0;border-radius:4px;background:color-mix(in srgb,var(--c) 20%,#101216);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);overflow:hidden;cursor:pointer}
  .freg:hover{background:color-mix(in srgb,var(--c) 26%,#101216)}
  .frl{position:absolute;left:7px;top:3px;font-size:11px;font-weight:600;white-space:nowrap;color:#fff}
  .frl em{font-style:normal;font-weight:400;color:rgba(255,255,255,.6);margin-left:8px;font-family:var(--mono);font-size:10.5px}
  .fsec{position:absolute;left:0;right:0;bottom:0;height:5px}
  .fsec i{position:absolute;top:0;bottom:0;opacity:.85}
  .fph{position:absolute;top:0;bottom:0;width:1.5px;background:#fff;z-index:3;pointer-events:none;display:none}
  .folder.playing .fph{display:block}

  .fbody{display:none;position:relative}
  .folder.open .fbody{display:block}
  .fgrid{position:absolute;top:0;left:var(--head);pointer-events:none;z-index:0}
  .fbody .row{position:relative;z-index:1}
  .row{display:grid;grid-template-columns:var(--head) auto}
  .lh{position:sticky;left:0;z-index:5;background:var(--s1);user-select:none;border-right:1px solid var(--hair);display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--faint)}
  .lane{position:relative}
  .row.ruler{position:sticky;top:40px;z-index:7}
  .ruler .lane{height:24px;border-bottom:1px solid #050607;background:#15181d;cursor:text}
  .ruler canvas{position:absolute;inset:0}
  .ruler span{position:absolute;top:3px;font:10px var(--mono);color:var(--muted);padding-left:4px;white-space:nowrap;pointer-events:none}
  .rph{position:absolute;top:0;bottom:0;width:0;z-index:2;pointer-events:none;display:none}
  .rph::before{content:"";position:absolute;left:-6px;bottom:0;border:6px solid transparent;border-top:0;border-bottom:8px solid #fff}
  .rph::after{content:"";position:absolute;left:-.75px;top:0;bottom:0;width:1.5px;background:#fff}
  .folder.playing .rph{display:block}
  .cyc{position:absolute;top:0;height:7px;background:rgba(245,165,36,.55);border-radius:2px;pointer-events:none}
  .ruler span em{font-style:normal;color:var(--cyan);margin-left:4px}
  .tempo .lane{height:30px;cursor:copy}
  .tv{position:absolute;font:10px var(--mono);color:var(--cyan);padding:0 3px;background:var(--bg);border-radius:3px;white-space:nowrap}
  .secs .lane{height:30px;border-bottom:1px solid var(--hair)}
  .sec{position:absolute;top:4px;bottom:4px;border-radius:4px;padding:0 7px;font-size:11px;font-weight:600;color:#0b0c0e;overflow:hidden;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:5px}
  .sec:hover{filter:brightness(1.1)}
  .sec.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px #fff;z-index:2}
  .sec .eb{font-size:10px;opacity:.7}
  .sh{position:absolute;top:3px;bottom:3px;width:10px;margin-left:-5px;cursor:col-resize;z-index:3;border-radius:3px}
  .sh::after{content:"";position:absolute;left:4px;top:5px;bottom:5px;width:2px;border-radius:1px;background:transparent}
  .sh:hover::after,.sh.drag::after{background:#fff}
  .secpanel{border-bottom:1px solid var(--hair);padding-bottom:14px;margin-bottom:14px}
  .sph{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .sph .cd{width:10px;height:10px;border-radius:3px;flex:none}
  .sph input{flex:1;min-width:0;font-size:16px;font-weight:650;background:transparent;border-color:transparent;padding:2px 4px;margin-left:-4px}
  .sph input:hover,.sph input:focus{border-color:var(--hair);background:var(--bg)}
  .kicker{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--faint);margin-bottom:6px}
  .seg3{display:flex;background:var(--bg);border-radius:6px;padding:2px;gap:2px}
  .seg3 button{flex:1;padding:5px 0;border-radius:5px;font-size:11.5px;color:var(--muted)}
  .seg3 button.on{background:var(--s3);color:var(--text)}
  .endhint{font-size:11.5px;color:var(--muted);margin:-2px 0 8px 86px}
  textarea{font:inherit;font-size:12px;color:var(--text);background:var(--bg);border:1px solid var(--hair);border-radius:5px;padding:5px 7px;width:100%;resize:vertical;outline:none}
  .splitrow{display:none;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}
  .splitrow.show{display:flex}
  .splitrow input{width:64px}
  .smidi{font-size:12px;display:flex;justify-content:space-between;padding:3px 0}
  .smidi span:last-child{color:var(--blue)}
  .trk .lane{height:var(--th);border-bottom:1px solid #16191e;cursor:text}
  .trk .lh{gap:8px;padding:0 8px 0 0;border-bottom:1px solid #050607;background:var(--s1)}
  .tno{width:18px;text-align:right;font:10.5px var(--mono);color:var(--faint);flex:none}
  .ms{display:flex;gap:3px;flex:none}
  .sb{width:19px;height:19px;border-radius:4px;font-size:10px;font-weight:700;color:var(--faint);background:var(--s2);flex:none}
  .sb:hover{color:var(--text)} .sb.on{background:#e5d24a;color:#1b1600}
  .hm{position:relative;width:5px;height:calc(var(--th) - 16px);border-radius:1px;background:linear-gradient(to top,#3ddc84 0 66%,#d7e04a 66% 86%,#ff5468 86%);overflow:hidden;flex:none}
  .hm b,.mt b{position:absolute;left:0;right:0;top:0;height:100%;background:#22262d}
  .trk .lh .c{width:3px;align-self:stretch}
  .trk .lh .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .trk .lh .tn{font-size:12px;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trk .lh .rt{font:10px var(--mono);color:var(--faint);white-space:nowrap}
  .trk .lh .newr{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .trk .lh .edm{color:var(--blue);font-size:11px;padding:2px 7px;border-radius:4px}
  .vol{display:flex;align-items:center;gap:6px;flex:none}
  input.fad{-webkit-appearance:none;appearance:none;width:70px;height:16px;background:transparent;padding:0;border:0;cursor:pointer;--p:90%}
  input.fad.wide{width:100%}
  input.fad::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,#9aa0aa var(--p),#2a2f37 var(--p))}
  input.fad::-moz-range-track{height:3px;border-radius:2px;background:linear-gradient(to right,#9aa0aa var(--p),#2a2f37 var(--p))}
  input.fad::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#e9ebef;margin-top:-4px;box-shadow:0 0 0 2px var(--s1)}
  input.fad::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:#e9ebef}
  input.fad:hover::-webkit-slider-thumb{background:#fff;transform:scale(1.15)}
  .db{font-size:10.5px;color:var(--muted);width:32px;text-align:right;white-space:nowrap}
  .db.hot{color:var(--accent)}
  .mb{width:19px;height:19px;border-radius:4px;font-size:10px;font-weight:700;color:var(--faint);background:var(--s2);flex:none}
  .mb:hover{color:var(--text)} .mb.on{background:var(--accent);color:#1b1200}
  .trk.muted .tn{color:var(--muted)}
  .lvl{display:grid;grid-template-columns:86px 1fr 32px 19px;align-items:center;gap:8px;padding:3px 0;font-size:12px}
  .lvl span:first-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  
  .trk .lh .edm:hover{background:rgba(90,169,255,.12)}
  .trk canvas{display:block}
  .trk.midi canvas{cursor:pointer}
  .add{position:sticky;left:0;width:var(--vw,100%);display:flex;gap:2px;padding:6px 8px 10px calc(var(--head) + 4px)}
  .add .btn{font-size:11px;height:24px}
  .ph{position:absolute;top:40px;bottom:0;width:1.5px;background:#fff;z-index:4;pointer-events:none;display:none;box-shadow:0 0 6px rgba(255,255,255,.35)}
  .folder.playing.open .ph{display:block}
  body.t-split .secs .lane,body.t-split .secs .sec{cursor:crosshair}
  .emptyarr{position:relative;min-height:100%;background:linear-gradient(to right,var(--s1) 0 var(--head),transparent var(--head)),repeating-linear-gradient(to right,transparent 0 79px,#16191e 79px 80px);background-color:#0d0f12}
  .emptyarr::before{content:"";position:absolute;left:var(--head);top:0;bottom:0;border-left:1px solid #050607}
  .emptyarr .blank{position:relative;padding-top:120px}
  .mixer{display:none;height:330px;border-top:1px solid #050607;background:var(--s1);grid-template-rows:38px 1fr;min-height:0;box-shadow:0 -12px 30px rgba(0,0,0,.35)}
  .mixer.open{display:grid}
  .mxh{display:flex;align-items:center;gap:10px;padding:0 10px 0 16px;border-bottom:1px solid var(--hair);font-size:12px}
  .mxh b{font-weight:600}
  .mxh .sp{margin-left:auto}
  .strips{display:flex;overflow:auto;padding:10px 12px;gap:4px;min-height:0}

  .btn.dangerfill{background:var(--red)}

  .emptyarr::before{border-left-color:rgba(0,0,0,.5)}
  html.ap-darker .emptyarr{background:linear-gradient(to right,#0b0b0c 0 var(--head),transparent var(--head)),repeating-linear-gradient(to right,transparent 0 79px,rgba(255,255,255,.025) 79px 80px);background-color:#000}

  /* ======== calm pass: less on screen, more app-like ======== */
  /* app, not page */
  body{-webkit-user-select:none;user-select:none;overscroll-behavior:none;cursor:default}
  input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
  button,a,.song,.ps,.sec,.tr,.fh,label{cursor:default}
  img,svg,a{-webkit-user-drag:none}
  :focus:not(:focus-visible){outline:none}
  *{transition-duration:0s!important}
  .tb,.btn,.ib2,.tl,.tabs a,.mb,.sb{transition:background-color .08s!important}
  /* toolbar: only what you reach for constantly */
  #cutB,#copyB,#pasteB,#dupB,#expandAll,#collapseAll,#thBtn,.etool .igrp:has(#expandAll)+.vsep{display:none!important}
  .etool .igrp:has(#expandAll){display:none}
  #sessCount{display:none}
  /* sidebar: one line per song */
  .song{display:grid;grid-template-columns:22px 1fr auto;align-items:center;row-gap:4px;padding:6px 10px}
  .song .m{display:none} .song .vrow{grid-column:2/4}
  .tr{height:16px;padding-left:32px;font-size:10.5px;color:var(--faint);opacity:.75}
  .tr i{font-size:10px} .tr:not(:hover){color:var(--faint)}
  .tr.stop{opacity:.0} .tr.stop:hover{opacity:.75}
  /* lane headers */
  .lh{text-transform:none;letter-spacing:0;font-size:12px;font-weight:500}
  .row.ruler .lh{opacity:0}
  /* track headers: name first; levels and routing appear on hover */

  .trk:hover .lh .vol,.trk:hover .lh input.fad,.trk:hover .lh .db,.trk:hover .lh .hm{opacity:1}
  .trk .lh .tn{font-size:13px}
  .mb,.sb{background:transparent;color:var(--faint)} .trk:hover .mb,.trk:hover .sb{background:rgba(255,255,255,.08);color:var(--muted)}
  .mb.on,.sb.on{opacity:1}
  .trk:hover .mb.on{background:var(--accent);color:#2b1600} .trk:hover .sb.on{background:#ffd60a;color:#2b2200}
  .edm{background:transparent;color:var(--faint)} .trk:hover .edm{background:rgba(10,132,255,.16);color:#64b5ff}
  .cgear{opacity:0} .trk:hover .cgear{opacity:1}
  .add{opacity:.6} .add:hover{opacity:1}
  /* the open song already says its name: keep its overview strip to colour only */
  .folder.open .frl{display:none}
  /* inspector: drop the routing list (it's on Outputs & MIDI, and on hover in the track headers) */
  .sect.routing select{font:11px var(--mono);max-width:150px}
  .trk .lh .tx{position:relative;align-self:center} .trk .lh .rt{position:absolute;top:100%;left:0;margin-top:1px;white-space:nowrap;font-size:10.5px}
  .trk .lh{align-items:center}

  /* ---- New Song sheet ---- */
  .modalbg{background:rgba(0,0,0,.45);backdrop-filter:none}
  .modal.nsong{width:540px;background:#252527;border:1px solid rgba(255,255,255,.1);border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 .5px rgba(0,0,0,.8);font-family:var(--sf)}
  html.ap-darker .modal.nsong{background:#161618}

  .nsong .bd{padding:10px 18px 6px;gap:18px}

  .dz{border:1.5px dashed rgba(255,255,255,.16);border-radius:10px;min-height:96px;display:flex;flex-direction:column;justify-content:center;background:rgba(0,0,0,.12)}

  .dz.has{border-style:solid;border-color:rgba(255,255,255,.1);justify-content:flex-start;padding:4px}
  .dzEmpty{display:flex;flex-direction:column;align-items:center;gap:3px;padding:16px;text-align:center;font-size:12px;color:var(--faint)} .dzEmpty b{font-size:13px;font-weight:600;color:var(--text)}
  .dzi{width:30px;height:30px;color:var(--muted);margin-bottom:4px} .dzi svg{width:100%;height:100%} .dzi.sm{width:22px;height:22px;margin:0}
  .lnk{all:unset;color:var(--accent);font-weight:500} .lnk:hover{text-decoration:underline}
  .flist{max-height:220px;overflow:auto}
  .fr{display:grid;grid-template-columns:18px minmax(0,1fr) 40px 132px 20px;align-items:center;gap:8px;padding:4px 6px 4px 8px;border-radius:6px;font-size:12.5px}
  .fr:nth-child(odd){background:rgba(255,255,255,.035)} .fr.skip .fn,.fr.skip .fi,.fr.skip .fl{opacity:.35}
  .fi{color:var(--muted);width:14px;height:14px} .fi svg{width:14px;height:14px}
  .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .fl{font-family:var(--code);font-size:11px;color:var(--faint);text-align:right}
  .fr .xs{width:100%;height:24px;font-size:12px;background:rgba(255,255,255,.06);border-color:transparent}

  .mrow{all:unset;display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1.5px dashed rgba(255,255,255,.16);background:rgba(0,0,0,.12)}
  .mrow:hover{border-color:rgba(255,255,255,.28)} .mrow.ok{border-style:solid;border-color:rgba(48,209,88,.5)} .mrow.ok .dzi{color:var(--green)} .mrow.bad{border-color:var(--red)}
  .mtx{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--faint)} .mtx b{font-size:13px;font-weight:600;color:var(--text)}
  .nsong footer{display:flex;align-items:center;gap:8px;padding:14px 18px 16px;border-top:0}
  .nsong footer .btn{height:28px;min-width:84px;justify-content:center}

  .nsong [hidden]{display:none!important} .nsong footer .sp{flex:1}

// ======================= TEMPO =======================
function bpmAt(s,barPos){ const pts=s.tmap.filter(e=>e.bpm).sort((a,b)=>a.bar-b.bar); let prev=pts[0]; for(const p of pts) if(p.bar<=barPos) prev=p;
  const next=pts.find(p=>p.bar>barPos); if(next&&next.ramp) return prev.bpm+(next.bpm-prev.bpm)*(barPos-prev.bar)/(next.bar-prev.bar); return prev.bpm; }
function sigAt(s,bar){ let sig=s.tmap[0].sig; s.tmap.filter(e=>e.sig).sort((a,b)=>a.bar-b.bar).forEach(e=>{ if(e.bar<=bar) sig=e.sig; }); return sig; }
// Imported stems get unique track names ("Drums", "Kick"...); s.troles remembers each one's role, which
// decides its outputs and colour.
function regRoles(s){ Object.entries(s.troles||{}).forEach(([t,r])=>{ if(ROLE[t]===undefined&&ROLE[r]!==undefined){ ROLE[t]=ROLE[r]; if(TCOL[r]) TCOL[t]=TCOL[r]; } }); }
function buildBars(s){
  regRoles(s);
  s.tmap.sort((a,b)=>a.bar-b.bar); s.secs=(s.secs||[]).sort((a,b)=>a.start-b.start);
  let need=1; s.tmap.forEach(m=>need=Math.max(need,m.bar)); s.secs.forEach(x=>need=Math.max(need,x.start+x.bars-1)); (s.ck||[]).forEach(r=>need=Math.max(need,r.bar+r.bars-1)); (s.cues||[]).forEach(c=>need=Math.max(need,c.bar));
  Object.values(s.malts||{}).forEach(L=>L.forEach(a=>(a.regions||[]).forEach(r=>need=Math.max(need,r.bar+r.bars-1))));

  for(;b<4000;b++){ const sig=sigAt(s,b), q=4/sig[1], beatT=[]; let d=0;
    for(let k=0;k<sig[0];k++){ beatT.push(t+d); d+=q*60/bpmAt(s,b+(k+.5)/sig[0]); } bars.push({bar:b,t,sig,dur:d,beatT}); t+=d; if((target===undefined||t>=target-1e-6)&&b>=need) break; }
  { const sig=sigAt(s,b+1), q=4/sig[1], beatT=[]; let d=0; for(let k=0;k<sig[0];k++){ beatT.push(t+d); d+=q*60/bpmAt(s,b+1+(k+.5)/sig[0]); } bars.push({bar:b+1,t,sig,dur:d,beatT}); }

  if(s.midi) Object.values(s.midi).forEach(l=>l.forEach(e=>{ if(e.anchor==='section'){ const p=s.secPos.find(q=>q.id===e.secId); if(p){ e.bar=p.start; e.beat=1; } else e.anchor='free'; } }));
  if(s.audio===undefined) s.audio=s.len;
}

  const QCm={intro:'qc-A',verse:'u2',pre:'qc-B',chorus:'u3',bridge:'qc-D',outro:'qc-A',turn:'qc-E'}, AXm={intro:'ax-1',verse:'ax-2',pre:'ax-3',chorus:'ax-4',bridge:'u5',outro:'ax-1',turn:'ax-6'};

// ---------- alternate MIDI tracks: each MIDI track holds named alternates; s.midi[t] always points at the one in use ----------

const curAlt=(s,t)=>altsOf(s,t).find(a=>a.id===s.muse[t])||altsOf(s,t)[0];

  const env=(g,peak,dec)=>{ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+.002); g.gain.exponentialRampToValueAtTime(0.0001,t+dec); };
  const osc=(type,f,dec,peak=1,dst=out)=>{ const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.value=f*P; env(g,peak,dec); o.connect(g); g.connect(dst); o.start(t); o.stop(t+dec+.02); return o; };
  const noise=(dec,ftype,f,q=1,peak=1)=>{ const n=a.createBufferSource(), b=a.createBuffer(1,a.sampleRate*.2,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; n.buffer=b;
    const fl=a.createBiquadFilter(); fl.type=ftype; fl.frequency.value=f*P; fl.Q.value=q; const g=a.createGain(); env(g,peak,dec); n.connect(fl); fl.connect(g); g.connect(out); n.start(t); n.stop(t+dec+.02); };

  else if(kind==='clave') osc('sine',acc?3000:2500,.04,.9);
  else if(kind==='rim'){ noise(.03,'highpass',2500,1,.8); osc('triangle',acc?1900:1600,.025,.5); }
  else if(kind==='cow'){ const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=(acc?900:700)*P; bp.Q.value=3; bp.connect(out); osc('square',acc?640:540,.16,.5,bp); osc('square',acc?960:800,.16,.5,bp); }

try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
function sayCue(text,vol){ if(window.SLC&&text){ const s=songs.find(x=>x.id===(pick&&pick.song)||x.id===selId); if(s){ SLC.preview(s,text); return; } } try{ if(!window.speechSynthesis||!text) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); if(cueVoice) u.voice=cueVoice; u.rate=1.08; u.volume=Math.max(0,Math.min(1,vol??1)); speechSynthesis.speak(u); }catch(e){} }

  cuesOf(s).forEach(c=>{ if(!s.bars[c.bar-1]) return; const ct=cueT(s,c), tt=Math.max(0,ct-LEAD), key=s.id+'|'+c.id+'|'+ct; if(tt>=a&&tt<b&&key!==lastCueKey){ lastCueKey=key; sayCue(c.text,linOf(gainOf(s,'Cues'))); } }); }

const curSong=()=>songs.find(x=>x.id===ed.song);
const changed=()=>{ const s=curSong(); if(s&&ed.track&&isMidiTrack(s,ed.track)){ const R=regsOf(s,ed.track); s.midi[ed.track].forEach(e=>{ if(!R.some(r=>e.bar>=r.bar&&e.bar<r.bar+r.bars)){ const nx=Math.min(s.total+1,...R.filter(r=>r.bar>e.bar).map(r=>r.bar)); R.push({id:'r'+regSeq++,bar:e.bar,bars:Math.max(1,Math.min(4,nx-e.bar))}); R.sort((a,b)=>a.bar-b.bar); } }); } renderFolders(); renderInsp(); renderDrawer(); };
function blankEvent(kind,bar,beat){ const e={id:evId++,bar,beat,anchor:'free',kind};
  if(kind==='qcPreset') Object.assign(e,{bank:1,slot:'A',setlist:1}); if(kind==='qcScene') e.scene='A'; if(kind==='axPreset') e.preset=0; if(kind==='axScene') e.scene=1;
  if(kind==='pc') e.pc=0; if(kind==='cc') Object.assign(e,{cc:1,val:127}); if(kind==='note') Object.assign(e,{note:36,vel:100,len:1}); return e; }
// Where a MIDI event lands: the nearest grid point (Snap on), as bar + (fractional) beat.
function nearestBeat(s,t){ const x=barBeatAt(s,Math.max(0,Math.min(s.bars[s.total-1].t+s.bars[s.total-1].dur-1e-6,snapT(s,t,false)))); return {bar:Math.min(x.bar,s.total),beat:x.beat}; }
const opt=(arr,v)=>arr.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('');
const profPresets=prof=>presets.filter(p=>p.profile===prof);
function fieldsFor(o){ // value fields for an event or a preset payload
  let h=''; const k=o.kind;
  if(k==='qcPreset') h+=`<div class="kv"><label>Preset</label><div style="display:flex;gap:4px"><select data-k="bank" data-n>${opt([...Array(32)].map((_,i)=>[i+1,'Bank '+(i+1)]),o.bank)}</select><select data-k="slot">${opt([...QCL],o.slot)}</select></div></div>
     <div class="kv"><label>Setlist</label><select data-k="setlist" data-n>${opt([...Array(16)].map((_,i)=>[i+1,String(i+1)]),o.setlist)}</select></div>`;
  if(k==='qcScene') h+=`<div class="kv"><label>Scene</label><select data-k="scene">${opt([...QCL],o.scene)}</select></div>`;
  if(k==='axPreset') h+=`<div class="kv"><label>Preset #</label><input data-k="preset" data-n type="number" min="0" max="1023" value="${o.preset}"></div>`;
  if(k==='axScene') h+=`<div class="kv"><label>Scene</label><select data-k="scene" data-n>${opt([1,2,3,4,5,6,7,8],o.scene)}</select></div>`;
  if(k==='pc') h+=`<div class="kv"><label>Program</label><input data-k="pc" data-n type="number" min="0" max="127" value="${o.pc}"></div>`;
  if(k==='cc') h+=`<div class="kv"><label>CC · value</label><div style="display:flex;gap:4px"><input data-k="cc" data-n type="number" min="0" max="127" value="${o.cc}"><input data-k="val" data-n type="number" min="0" max="127" value="${o.val}"></div></div>`;
  if(k==='note') h+=`<div class="kv"><label>Note · vel</label><div style="display:flex;gap:4px"><input data-k="note" data-n type="number" min="0" max="127" value="${o.note}"><input data-k="vel" data-n type="number" min="1" max="127" value="${o.vel}"></div></div>`;
  return h;
}
function wireFields(root,obj,after){ root.querySelectorAll('[data-k]').forEach(el=>el.onchange=()=>{ obj[el.dataset.k]=el.hasAttribute('data-n')?+el.value:el.value; after(); }); }

  <div class="tset ${ed.settings?'show':''}">

    <label>Device <select id="cfgProf">${opt([['qc','Quad Cortex'],['axe','Axe-Fx III'],['gen','Generic']],cfg.profile)}</select></label>
    <label title="Send this track's messages early so presets are loaded by the downbeat">Send early <select id="cfgEarly">${opt([['0','Off'],['16','1/16'],['8','1/8'],['4','1 beat'],['50ms','50 ms'],['100ms','100 ms']],cfg.early)}</select></label>
    <button class="btn danger" id="delTrack" style="margin-left:auto">Delete track</button></div>
  <div class="dbody">`;
  if(ed.tab==='events'){
    const L=s.len; let tl='';
    s.secPos.forEach(p=>{ const a=s.bars[p.start-1].t/L*100, w=(s.bars[p.start-1+p.bars].t-s.bars[p.start-1].t)/L*100; tl+=`<div class="msec" style="left:${a}%;width:${w}%;background:${SEC_C[p.type]}"></div><div class="mlab" style="left:${a}%">${esc(p.name)}</div>`; });
    let lastX=-1e9,row=0; evs.forEach(e=>{ const xp=evTime(s,e)/L*100; row=(xp-lastX<7&&row===0)?1:0; lastX=xp;
      tl+=`<div class="pin ${e.presetId&&!P(e.presetId)?.built?'lk':''} ${e.id===ed.sel?'sel':''} ${row?'r2':''}" data-id="${e.id}" style="left:${xp}%"><b>${esc(evName(e))}</b></div>`; });
    tl+=`<div class="ghost" id="ghost"></div>`;
    h+=`<div class="dleft"><div class="mtl" id="mtl" title="Click to add · drag pins to move · drop presets here">${tl}</div>
      <div class="elist">${evs.length?`<table class="ev"><tr><th>Pos</th><th>Section</th><th>Event</th><th>Sends</th><th>Follows</th><th></th></tr>
      ${evs.map(e=>`<tr data-id="${e.id}" class="${e.id===ed.sel?'sel':''}"><td class="pos">${e.bar}.${e.beat}</td><td class="muted">${esc(secOfBar(s,e.bar)?.name||'')}</td>
        <td>${e.presetId&&!P(e.presetId)?.built?'<span class="lk">●</span> ':''}${esc(evName(e))}</td><td class="raw">${rawOf(e)}</td><td class="muted">${{section:'Section',start:'Song start',free:'Bar'}[e.anchor]}</td><td><button class="x" data-del="${e.id}">×</button></td></tr>`).join('')}</table>`
      :'<div class="empty">No events. Click the timeline, drop a preset on it, or use Section map.</div>'}</div></div>`;
    h+=`<div class="dright">`;
    if(sel){
      const lp=sel.presetId?P(sel.presetId):null;
      h+=`<h4>Event at ${sel.bar}.${sel.beat}<button class="ibtn" id="deselect" title="Back to presets">✕</button></h4>
        <div class="kv"><label>Preset</label><select id="fPreset"><option value="">Custom</option>${profPresets(cfg.profile).map(p=>`<option value="${p.id}" ${p.id===sel.presetId?'selected':''}>${esc(p.name)}${p.built?'':' ●'}</option>`).join('')}</select></div>
        ${lp&&!lp.built?`<div class="linked"><span>Linked to “${esc(lp.name)}”</span><button id="editPreset">Edit preset</button></div>`:''}
        <div class="kv"><label>Type</label><select id="fKind">${opt(prof.kinds.map(k=>[k,KIND_NAME[k]]),sel.kind)}</select></div>
        <div id="fVals">${fieldsFor(sel)}</div>
        <div class="kv"><label>Position</label><div style="display:flex;gap:4px"><input id="fBar" type="number" min="1" max="${s.total}" value="${sel.bar}"><input id="fBeat" type="number" min="1" max="${s.bars[sel.bar-1].sig[0]}" value="${sel.beat}"></div></div>
        <div class="kv"><label>Follows</label><select id="fAnchor">${opt([['section','Its section'],['start','Song start'],['free','Its bar']],sel.anchor)}</select></div>
        <div class="raw2">Ch ${cfg.ch} · ${rawOf(sel)}</div>
        <div class="acts"><button class="btn test" id="sendNow">▶ Test</button><button class="btn line" id="saveAs">Save as preset</button><button class="btn" id="dupEv">Duplicate</button><button class="btn danger" id="delEv">Delete</button></div>

    } else {

      h+=`<input class="search" id="pq" placeholder="Search ${prof.name} presets" value="${esc(ed.q)}">
        <div class="kv" style="margin:0 0 10px"><label>Add at</label><select id="aAt"><option value="play">Playhead</option>${s.secPos.map(p=>`<option value="${p.start}">${esc(p.name)} · ${p.start}</option>`).join('')}</select></div>
        <h4>Saved</h4><div class="pal">${list.filter(p=>!p.built).map(item).join('')||'<div class="faint" style="font-size:12px;padding:4px 8px">None yet. Select an event → Save as preset</div>'}</div>
        ${list.some(p=>p.built)?`<h4>Built-in</h4><div class="pal">${list.filter(p=>p.built).map(item).join('')}</div>`:''}
        <h4>Custom</h4><div class="pal">${prof.kinds.filter(k=>!['qcScene','axScene'].includes(k)).map(k=>`<div class="pi built" data-kind="${k}"><span class="pn"><i></i>${KIND_NAME[k]}…</span></div>`).join('')}</div>`;
    }
    h+=`</div>`;
  } else if(ed.tab==='map'){
    const types=[...new Set(s.secPos.map(p=>p.type))], m=s.secMap[t]||(s.secMap[t]={}), list=profPresets(cfg.profile);
    h+=`<div class="dleft" style="grid-template-rows:1fr"><div class="elist" style="padding-top:12px"><table class="smap"><tr><th>Section</th><th>In this song</th><th>Preset</th></tr>
      ${types.map(ty=>`<tr><td><i style="background:${SEC_C[ty]}"></i>${ty}</td><td class="muted">${s.secPos.filter(p=>p.type===ty).map(p=>esc(p.name)).join(', ')}</td>
        <td><select data-ty="${ty}" class="mapSel"><option value="">—</option>${list.map(p=>`<option value="${p.id}" ${m[ty]===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></td></tr>`).join('')}</table></div></div>
      <div class="dright"><h4>Fill the song</h4><p class="muted" style="font-size:12px;margin-bottom:10px">One linked event at the start of every section. Hand-placed events stay.</p>
      <div class="kv"><label>First section</label><select id="mapFirst"><option value="skip">Skip</option><option value="inc">Include</option></select></div>
      <div class="acts"><button class="btn pri" id="applyMap">Apply</button><button class="btn" id="saveMapDefault">Save as default</button></div></div>`;
  } else {
    const list=profPresets(cfg.profile), ps=P(ed.pSel)||list.find(p=>!p.built)||list[0];
    const uses=id=>songs.reduce((a,x)=>a+Object.values(x.midi||{}).reduce((b,l)=>b+l.filter(e=>e.presetId===id).length,0),0);
    h+=`<div class="dleft" style="grid-template-rows:1fr"><div class="elist" style="padding-top:12px"><table class="ev"><tr><th>${PROFILES[cfg.profile].name} presets</th><th>Sends</th><th>Used</th><th></th></tr>
      ${list.map(p=>`<tr data-pid="${p.id}" class="${ps&&p.id===ps.id?'sel':''}" style="cursor:pointer"><td>${p.built?'<span class="faint">●</span>':'<span class="lk">●</span>'} ${esc(p.name)}</td><td class="raw">${rawOf(p.p)}</td><td class="muted">${uses(p.id)}</td><td>${p.built?'':`<button class="x" data-pdel="${p.id}">×</button>`}</td></tr>`).join('')}</table></div></div>
      <div class="dright">${ps?`<h4>${ps.built?'Built-in preset':'Edit preset'}</h4>

function wireDrawer(s,t,cfg,evs,sel){
  const q=id=>document.getElementById(id);
  q('closeMidi').onclick=closeMidi;
  q('tsBtn').onclick=()=>{ ed.settings=!ed.settings; renderDrawer(); };
  q('trkSel').onchange=e=>{ ed.track=e.target.value; ed.sel=null; changed(); };
  wireAltSelects(document.getElementById('drawer'));
  q('altName').onchange=e=>{ const a=curAlt(s,t); a.name=e.target.value.trim()||a.name; changed(); };
  if(q('altDel')) q('altDel').onclick=()=>{ const list=altsOf(s,t), a=curAlt(s,t); s.malts[t]=list.filter(x=>x!==a); (s.versions||[]).forEach(v=>{ if(v.state&&v.state.muse&&v.state.muse[t]===a.id) v.state.muse[t]=s.malts[t][0].id; }); useAlt(s,t,s.malts[t][0].id); changed(); };
  q('trkName').onchange=e=>{ const nn=e.target.value.trim(); if(!nn||s.tracks.includes(nn)) return; altsOf(s,t); s.tracks[s.tracks.indexOf(t)]=nn; ['midiCfg','midi','secMap','malts','muse'].forEach(k=>{ s[k][nn]=s[k][t]; delete s[k][t]; }); ed.track=nn; changed(); };
  q('cfgPort').onchange=e=>{ cfg.port=e.target.value; changed(); };
  q('cfgCh').onchange=e=>{ cfg.ch=+e.target.value; changed(); };
  q('cfgEarly').onchange=e=>{ cfg.early=e.target.value; };
  q('cfgProf').onchange=e=>{ cfg.profile=e.target.value; const ks=PROFILES[cfg.profile].kinds; s.midi[t].forEach(ev=>{ if(!ks.includes(ev.kind)){ PAYKEYS.forEach(k=>delete ev[k]); delete ev.presetId; Object.assign(ev,{kind:'pc',pc:0}); } }); changed(); };
  q('delTrack').onclick=()=>{ s.tracks.splice(s.tracks.indexOf(t),1); ['midiCfg','midi','secMap'].forEach(k=>delete s[k][t]); const rest=s.tracks.filter(x=>isMidiTrack(s,x)); if(rest.length){ ed.track=rest[0]; changed(); } else { closeMidi(); refresh(); } };
  drawer.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ ed.tab=b.dataset.tab; renderDrawer(); });

  if(ed.tab==='events'){
    const mtl=q('mtl'), ghost=q('ghost'), L=s.len, tAt=ev=>{ const r=mtl.getBoundingClientRect(); return Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*L; };
    const addEv=(e)=>{ s.midi[t].push(e); ed.sel=e.id; changed(); };
    mtl.onmousemove=ev=>{ if(ev.target.closest('.pin')){ ghost.style.display='none'; return; } const nb=nearestBeat(s,tAt(ev)); ghost.style.display='block'; ghost.style.left=(evTime(s,nb)/L*100)+'%'; };
    mtl.onmouseleave=()=>ghost.style.display='none';
    mtl.onclick=ev=>{ if(ev.target.closest('.pin')) return; const nb=nearestBeat(s,tAt(ev)); const def=profPresets(cfg.profile).find(p=>p.built); const e={id:evId++,bar:nb.bar,beat:nb.beat,anchor:'free'};
      if(def) linkTo(e,def); else Object.assign(e,blankEvent('pc',nb.bar,nb.beat),{id:e.id}); addEv(e); };
    mtl.ondragover=ev=>{ ev.preventDefault(); mtl.classList.add('drop'); const nb=nearestBeat(s,tAt(ev)); ghost.style.display='block'; ghost.style.left=(evTime(s,nb)/L*100)+'%'; };
    mtl.ondragleave=()=>{ mtl.classList.remove('drop'); ghost.style.display='none'; };
    mtl.ondrop=ev=>{ ev.preventDefault(); mtl.classList.remove('drop'); const pid=ev.dataTransfer.getData('text/preset'); const pr=P(pid); if(!pr) return; const nb=nearestBeat(s,tAt(ev)); const e={id:evId++,bar:nb.bar,beat:nb.beat,anchor:'free'}; linkTo(e,pr); addEv(e); };
    mtl.querySelectorAll('.pin').forEach(pin=>pin.onpointerdown=pe=>{ pe.stopPropagation(); const e=s.midi[t].find(x=>x.id==pin.dataset.id); ed.sel=e.id; pin.setPointerCapture(pe.pointerId);
      pin.onpointermove=m=>{ const nb=nearestBeat(s,tAt(m)); if(nb.bar!==e.bar||nb.beat!==e.beat){ e.bar=nb.bar; e.beat=nb.beat; e.anchor='free'; pin.style.left=(evTime(s,e)/L*100)+'%'; pin.querySelector('b').textContent=`${evName(e)} · ${e.bar}.${e.beat}`; } };
      pin.onpointerup=()=>{ pin.onpointermove=null; changed(); }; });
    drawer.querySelectorAll('.ev tr[data-id]').forEach(tr=>tr.onclick=ev=>{ if(ev.target.dataset.del) return; ed.sel=+tr.dataset.id; renderDrawer(); });
    drawer.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ s.midi[t]=s.midi[t].filter(x=>x.id!=b.dataset.del); if(ed.sel==b.dataset.del) ed.sel=null; changed(); });
    if(sel){
      q('deselect').onclick=()=>{ ed.sel=null; renderDrawer(); };
      q('fPreset').onchange=e=>{ const pr=P(e.target.value); if(pr) linkTo(sel,pr); else delete sel.presetId; changed(); };
      if(q('editPreset')) q('editPreset').onclick=()=>{ ed.tab='presets'; ed.pSel=sel.presetId; renderDrawer(); };
      q('fKind').onchange=e=>{ const ne=blankEvent(e.target.value,sel.bar,sel.beat); PAYKEYS.forEach(k=>delete sel[k]); delete sel.presetId; Object.assign(sel,payloadOf(ne)); changed(); };
      wireFields(q('fVals'),sel,()=>{ delete sel.presetId; changed(); });   // editing values makes it custom
      q('fBar').onchange=e=>{ const v=+e.target.value; if(v>=1&&v<=s.total){ sel.bar=v; sel.beat=Math.min(sel.beat,s.bars[v-1].sig[0]); sel.anchor='free'; changed(); } };
      q('fBeat').onchange=e=>{ const v=+e.target.value; if(v>=1&&v<=s.bars[sel.bar-1].sig[0]){ sel.beat=v; sel.anchor='free'; changed(); } };
      q('fAnchor').onchange=e=>{ sel.anchor=e.target.value; if(sel.anchor==='section'){ const sp=secOfBar(s,sel.bar); sel.secId=sp.id; sel.bar=sp.start; sel.beat=1; } if(sel.anchor==='start'){ sel.bar=1; sel.beat=1; } changed(); };
      q('sendNow').onclick=()=>{ const b=q('sendNow'); b.classList.add('ok'); b.textContent='✓ Sent'; setTimeout(()=>{ b.classList.remove('ok'); b.textContent='▶ Test'; },900); };
      q('saveAs').onclick=()=>{ q('saveBox').classList.add('show'); q('saveName').focus(); q('saveName').select(); };
      const doSave=()=>{ const nm=q('saveName').value.trim(); if(!nm) return; const pr={id:'u'+(pid++),profile:cfg.profile,name:nm,p:payloadOf(sel)}; presets.push(pr); sel.presetId=pr.id; changed(); };
      q('saveOk').onclick=doSave; q('saveName').onkeydown=e=>{ if(e.key==='Enter') doSave(); if(e.key==='Escape') q('saveBox').classList.remove('show'); };
      q('dupEv').onclick=()=>{ const nb=s.bars[Math.min(sel.bar,s.total-1)]; const c={...sel,id:evId++,bar:nb.bar,beat:1,anchor:'free'}; s.midi[t].push(c); ed.sel=c.id; changed(); };
      q('delEv').onclick=()=>{ s.midi[t]=s.midi[t].filter(x=>x.id!==sel.id); ed.sel=null; changed(); };
    } else {
      q('pq').oninput=e=>{ ed.q=e.target.value; const c=e.target.selectionStart; renderDrawer(); const n=q('pq'); n.focus(); n.setSelectionRange(c,c); };
      const where=()=>{ const v=q('aAt').value; if(v==='play'){ const nb=nearestBeat(s,playId===s.id?pos:0); return {bar:nb.bar,beat:nb.beat,anchor:'free'}; } return {bar:+v,beat:1,anchor:'section',secId:secOfBar(s,+v).id}; };
      drawer.querySelectorAll('.pi[data-pid]').forEach(it=>{ it.onclick=()=>{ const e={id:evId++,...where()}; linkTo(e,P(it.dataset.pid)); addEv(e); };
        it.ondragstart=ev=>{ ev.dataTransfer.setData('text/preset',it.dataset.pid); }; });
      drawer.querySelectorAll('.pi[data-kind]').forEach(it=>it.onclick=()=>{ const w=where(); const e=blankEvent(it.dataset.kind,w.bar,w.beat); e.anchor=w.anchor; e.secId=w.secId; addEv(e); });
    }
  } else if(ed.tab==='map'){
