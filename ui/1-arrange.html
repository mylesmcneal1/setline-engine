<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>set.Line — Edit (mockup)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./src/fonts.css"><script type="module" src="./src/bridge.ts"></script><script type="module" src="./src/pages/arrange.ts"></script>
<style>
  :root{
    --bg:#0b0c0e; --s1:#111317; --s2:#171a1f; --s3:#1e2228; --hair:#22262d;
    --text:#e9ebef; --muted:#8a909b; --faint:#555b66;
    --accent:#f5a524; --green:#3ddc84; --red:#ff5468; --blue:#5aa9ff; --cyan:#45c8d6;
    --s-intro:#6b7cff; --s-verse:#22c3a6; --s-pre:#a46bff; --s-chorus:#f5a524; --s-bridge:#ff5fa2; --s-outro:#7d8696; --s-turn:#45c8d6;
    --mono: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --code: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --head:300px; --th:50px; --r:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:13px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;display:grid;grid-template-rows:54px 1fr;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--hair);border-radius:5px;padding:4px 7px;outline:none}
  input:focus,select:focus{border-color:var(--faint)}
  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  ::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:#22262d;border-radius:10px;border:2px solid var(--bg)} ::-webkit-scrollbar-corner{background:transparent}

  /* ---------- top bar ---------- */
  .top{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--s1);border-bottom:1px solid var(--hair)}
  .brand{font-weight:650;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
  .brand i{width:9px;height:9px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
  .ibtn{width:28px;height:28px;border-radius:var(--r);display:grid;place-items:center;color:var(--muted)}
  .ibtn:hover{background:var(--s2);color:var(--text)}
  .ibtn.on{color:var(--text)}
  .ibtn svg{width:16px;height:16px}
  .tabs{display:flex;gap:2px;margin-left:6px}
  .tabs a{padding:6px 11px;border-radius:var(--r);color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
  .tabs a:hover{color:var(--text)}
  .tabs a.on{background:var(--s2);color:var(--text)}
  .transport{margin-left:auto;display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:8px;padding:3px}
  .tb{width:32px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
  .tb svg{width:15px;height:15px}
  .tb:hover{background:var(--s2);color:var(--text)}
  .tb.play.on{color:var(--green);background:rgba(61,220,132,.12)}
  .tb.on{color:var(--accent);background:rgba(245,165,36,.12)}
  .lcd{display:flex;align-items:stretch;height:42px;border-radius:8px;background:#07080a;border:1px solid #1b1e24;font-family:var(--code);overflow:hidden}
  .lcd>div{display:flex;flex-direction:column;justify-content:center;padding:0 14px;border-left:1px solid #16191e}
  .lcd>div:first-child{border-left:0}
  .lcd b{font-weight:500;font-size:13px;color:#e9ebef;white-space:nowrap}
  .lcd span{font-size:9.5px;color:var(--faint);letter-spacing:.06em;margin-top:1px;white-space:nowrap}
  .lcd .lpos{min-width:148px}
  .lcd .lpos b{font-size:19px;letter-spacing:.02em;color:#fff}
  .lcd .lpos span{font-size:11px;letter-spacing:0;color:var(--muted)}
  .lcd .lsong{min-width:150px;max-width:200px;font-family:Inter,system-ui,sans-serif}
  .lcd .lsong b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .lcd .lsong span{letter-spacing:0;font-size:11px;overflow:hidden;text-overflow:ellipsis}
  .status{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;white-space:nowrap}
  .omt{display:flex;flex-direction:column;gap:2px;width:64px}
  .omt i{position:relative;display:block;height:4px;border-radius:1px;background:linear-gradient(to right,#3ddc84 0 66%,#d7e04a 66% 86%,#ff5468 86%);overflow:hidden}
  .omt i b{position:absolute;top:0;right:0;bottom:0;width:100%;background:#1b1e24}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}

  .main{display:grid;grid-template-columns:var(--lw,260px) minmax(0,1fr) var(--rw,290px);min-height:0;transition:grid-template-columns .18s ease}
  body.l-closed .main{--lw:0px} body.r-closed .main{--rw:0px}
  .side,.insp{background:var(--s1);min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .side{border-right:1px solid var(--hair)} .insp{border-left:1px solid var(--hair)}
  body.l-closed .side,body.r-closed .insp{border:0}
  .phead{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 14px;flex:none}
  .phead h2{font-size:13px;font-weight:600}
  .phead .sp{margin-left:auto;display:flex;gap:2px}

  /* ---------- setlist ---------- */
  .setsel{background:transparent;border:0;font-weight:600;font-size:13px;padding:0;cursor:pointer}
  .songs{overflow:auto;flex:1;padding:0 6px}
  .song{display:grid;grid-template-columns:22px 1fr auto;gap:0 8px;padding:7px 8px;border-radius:var(--r);cursor:grab;align-items:baseline}
  .song:hover{background:var(--s2)}
  .song.on{background:var(--s3)}
  .song.dragging{opacity:.35}
  .song.over{box-shadow:inset 0 2px 0 var(--accent)}
  .song .n{color:var(--faint);font:11px var(--mono)}
  .song .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .song .d{color:var(--muted);font:11px var(--mono)}
  .vsel{background:transparent;border:1px solid transparent;color:var(--muted);font-size:11px;padding:1px 4px;border-radius:5px;max-width:110px;cursor:pointer;flex:none}
  .vsel:hover{border-color:var(--hair);color:var(--text)} .vsel.multi{color:var(--cyan)}
  .song .vrow{grid-column:2/4;margin:2px 0 0 -4px}
  .asel{background:transparent;border:0;color:var(--blue);font-size:10.5px;padding:0;max-width:140px;cursor:pointer}
  .verlist .vr{display:flex;align-items:center;gap:6px;padding:3px 0} .verlist .vr input{flex:1;min-width:0;font-size:12px;padding:3px 6px;background:transparent;border-color:transparent} .verlist .vr input:hover,.verlist .vr input:focus{border-color:var(--hair);background:var(--bg)}
  .verlist .vr .dot2{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--faint);cursor:pointer;flex:none} .verlist .vr.on .dot2{border-color:var(--cyan);background:radial-gradient(var(--cyan) 45%,transparent 50%)}
  .song .m{grid-column:2/4;color:var(--faint);font-size:11px;font-family:var(--mono)}
  .tr{display:flex;align-items:center;gap:6px;height:16px;padding-left:38px;font-size:10px;color:var(--faint);cursor:pointer;user-select:none}
  .tr:hover{color:var(--muted)}
  .tr i{font-style:normal;width:12px;text-align:center}
  .tr.segue i{color:var(--green)} .tr.stop i{color:var(--red)} .tr.auto i{color:var(--blue)}
  .songs.dropzone{background:rgba(245,165,36,.04)}
  /* 6g: the Band view (screens, dashboard canvas, widgets), the fields table, statuses, Sync MIDI */
  .bandv{display:none;grid-template-columns:250px minmax(0,1fr) 300px;min-height:0;overflow:hidden}
  body.bd .main,body.bd .perf{display:none!important} body.bd .bandv{display:grid}
  .bandv .bl{background:var(--s1,#141415);border-right:1px solid var(--line);padding:10px 8px;overflow:auto}
  .blh{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 8px}
  .bscr{display:flex;align-items:center;gap:9px;padding:8px;border-radius:7px;cursor:pointer} .bscr:hover{background:#1f1f22} .bscr.on{background:var(--s3,#2a2a2e)}
  .bav{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#111;flex:none}
  .bscr .bt{flex:1;min-width:0;display:flex;flex-direction:column} .bscr .bt small{color:var(--muted);font-size:11px}
  .bdot{width:8px;height:8px;border-radius:50%;background:#3a3a40} .bdot.on{background:#30d158;box-shadow:0 0 6px #30d158}
  .bjoin{margin:14px 6px 0;padding:12px;background:var(--s2,#1c1c1e);border-radius:10px;text-align:center} .bqr svg{width:150px;height:150px;background:#fff;border-radius:6px;padding:6px}
  .bip{font:600 17px var(--mono,monospace);margin:6px 0 2px;word-break:break-all}
  .bfields{margin:12px 6px 0;font-size:12px;line-height:1.5}
  .bm{padding:14px 18px;overflow:auto;min-width:0} .bmh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .bcanvw{display:flex;justify-content:center} .bcanv{position:relative;width:min(100%,900px);max-height:68vh;background:#000;border-radius:14px;border:6px solid #2a2a2e;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:calc(100%/12) calc(100%/9)}
  .bw{position:absolute;box-sizing:border-box;padding:2px;cursor:grab;touch-action:none}
  .bw>span,.bw>small{position:relative;z-index:1;display:block;padding:4px 7px 0;font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis} .bw>small{font-weight:400;color:var(--muted);font-size:10.5px;padding-top:0}
  .bw::before{content:"";position:absolute;inset:2px;border-radius:7px;background:#1c1c1e;border:1px solid #333}
  .bw.ctl::before{background:color-mix(in srgb,var(--wc,#0a84ff) 30%,#1c1c1e);background:color-mix(in srgb,var(--wc,#0a84ff) 30%,#1c1c1e);border-color:var(--wc,#0a84ff)} .bw.on::before{border:2px solid var(--blue,#0a84ff)}
  .brs{position:absolute;right:3px;bottom:3px;width:12px;height:12px;cursor:nwse-resize;z-index:2;border-right:2px solid #888;border-bottom:2px solid #888}
  .bandv .br{background:var(--s1,#141415);border-left:1px solid var(--line);padding:12px;overflow:auto} .bandv .br h3{margin:4px 0 8px}
  .bwl{padding:7px 9px;border-radius:7px;background:var(--s2,#1c1c1e);margin-bottom:4px;font-size:12px;cursor:grab} .bwl:hover{background:#26262a}
  .ftab{border-collapse:collapse;width:100%;font-size:12.5px} .ftab th{text-align:left;color:var(--muted);font-weight:500;padding:4px 6px;position:sticky;top:0;background:#1c1c1e}
  .ftab td{padding:3px 6px;border-top:1px solid #26262a} .ftab td input,.ftab td select{width:100%;min-width:90px} .ftab td.chg input,.ftab td.chg select{box-shadow:inset 0 0 0 1px var(--amber,#f5a524);background:rgba(245,165,36,.12)}
  .bandstat{display:flex;gap:8px;margin-left:10px;font-size:11.5px} .bandstat[hidden]{display:none} .bandstat span{background:rgba(255,159,10,.16);color:#ffcc66;border-radius:6px;padding:3px 8px}
  .syncb{margin-left:8px;color:#64d2ff;border-color:#0a84ff} .syncb[hidden]{display:none} .syncb.synced{color:#30d158;border-color:#30d158;background:rgba(48,209,88,.12)}
  .qrbox svg{width:180px;height:180px;background:#fff;border-radius:8px;padding:8px}
  .clkrow{display:flex;gap:6px;align-items:center}
  /* 6f: the Library panel, the setlist picker, saved state, export / migration sheets */
  .libsec{flex:none;display:flex;flex-direction:column;border-top:1px solid var(--line);max-height:46%;min-height:120px}
  .libh{display:flex;align-items:center;gap:8px;padding:9px 10px 4px;font-size:12px;color:var(--muted)} .libh b{color:var(--text);font-weight:600;font-size:12.5px}
  .libtools{display:flex;gap:6px;padding:4px 8px 6px} .libtools input{flex:1;min-width:0;height:26px;padding:0 8px;font-size:12px}
  .libtools select{height:26px;font-size:11.5px;max-width:92px;background:var(--s2);border:1px solid var(--line);border-radius:6px;color:var(--text)}
  #pool{overflow:auto;padding:0 6px 6px;flex:1}
  .ps .indot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent,#f5a524);margin-right:6px;vertical-align:1px}
  .ps .vbadge{display:inline-block;margin-left:6px;padding:0 5px;border-radius:8px;font:10px var(--mono);background:rgba(127,224,207,.14);color:#7fe0cf;vertical-align:1px}
  .setpick{display:flex;align-items:center;gap:8px;min-width:0;max-width:210px;background:transparent;border:0;color:var(--text);font-weight:600;font-size:13px;padding:2px 4px;border-radius:6px}
  .setpick:hover{background:var(--s2)} .setpick .cb{width:4px;height:16px;border-radius:2px;flex:none} .setpick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .xm .it i .cb{display:inline-block;width:4px;height:13px;border-radius:2px;vertical-align:-2px}
  .savemk{margin-left:8px;font-size:11px;color:var(--faint);white-space:nowrap} .savemk.saving{color:var(--muted)} .savemk.err{color:#ff6b6b}
  .pset{background:transparent;border:1px solid var(--line);border-radius:7px;color:var(--text);padding:2px 9px;font:inherit;margin-right:6px}
  .mglist{max-height:260px;overflow:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px}
  .mglist label{display:flex;gap:10px;align-items:center;padding:7px 10px;font-size:12.5px;border-bottom:1px solid var(--hair,rgba(255,255,255,.05))} .mglist label:last-child{border-bottom:0}
  .mglist small{margin-left:auto;color:var(--faint);font:11px var(--mono)}
  .impch{display:flex;gap:6px;margin-top:10px} .impch button{flex:1}
  details.pool{flex:none;border-top:1px solid var(--hair);padding:4px 6px 6px;max-height:40%;overflow:auto}
  details.pool summary{list-style:none;cursor:pointer;padding:8px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}
  details.pool summary::-webkit-details-marker{display:none}
  details.pool summary::after{content:"›";transition:transform .15s}
  details.pool[open] summary::after{transform:rotate(90deg)}
  .ps{display:flex;justify-content:space-between;padding:5px 8px;border-radius:var(--r);font-size:12px;color:var(--muted);cursor:grab}
  .ps:hover{background:var(--s2);color:var(--text)}
  .ps span:last-child{font:11px var(--mono);color:var(--faint)}
  .setfoot{flex:none;display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--hair);color:var(--muted);font-size:12px}
  .setfoot b{font:500 12px var(--mono);color:var(--text)}

  /* ---------- edit area ---------- */
  .edit{overflow:hidden;display:grid;grid-template-rows:44px auto 1fr auto auto auto;min-width:0;min-height:0}
  .etool{display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;border-bottom:1px solid var(--hair)}
  .etool h1{font-size:13px;font-weight:600}
  .etool .sp{margin-left:auto;display:flex;align-items:center;gap:4px}
  .btn{height:28px;padding:0 10px;border-radius:var(--r);color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:var(--s2);color:var(--text)}
  .btn.pri{background:var(--accent);color:#1b1200;font-weight:600}
  .btn.pri:hover{filter:brightness(1.08)}
  .btn.line{border:1px solid var(--hair)}
  .btn.danger:hover{color:var(--red)}
  .scroller{overflow:auto;min-height:0;position:relative;background:#0d0f12}
  .tools{display:flex;gap:2px;background:var(--bg);border-radius:7px;padding:2px;margin-left:8px}
  .tl{width:28px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
  .tl svg{width:14px;height:14px}
  .tl:hover{color:var(--text)} .tl.on{background:var(--s3);color:var(--text)}
  .zoom{display:flex;align-items:center;gap:4px;color:var(--muted);margin-left:6px}
  .filebar{display:flex;align-items:center;gap:2px;margin-left:6px} .filebar .fbtn{height:24px;padding:0 9px;border-radius:6px;color:var(--muted);font-size:12.5px;font-weight:500}
  .filebar .fbtn:hover,.filebar .fbtn.open{background:#1d2126;color:var(--text)} .dirtymk{margin-left:8px;font-size:11px;color:var(--amber);white-space:nowrap} .dirtymk[hidden]{display:none}
  .copymk{margin-left:10px;display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);white-space:nowrap} .copymk[hidden]{display:none}
  .copymk i{display:block;width:70px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden} .copymk b{display:block;height:100%;width:0;background:var(--amber,#f5a524)}
  .listenc{display:flex;align-items:center;gap:2px;margin-left:10px} .listenc .seg{margin-left:0;background:#0b0c0e;border:1px solid #1f2328;border-radius:8px;padding:2px}
  .listenc .seg button{white-space:nowrap;padding:3px 9px;font-size:11.5px;border-radius:6px} .listenc .seg button.on{background:#22262d;color:var(--text)} .listenc .seg button.on[data-v="pc"]{background:#f5a524;color:#1a1000}
  .listenbar{position:fixed;left:50%;transform:translateX(-50%);top:46px;z-index:9000;display:flex;align-items:center;gap:12px;padding:5px 8px 5px 14px;border-radius:0 0 10px 10px;background:#f5a524;color:#1a1000;font-size:12px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .listenbar[hidden]{display:none} .listenbar button{background:rgba(0,0,0,.16);color:#1a1000;border-radius:6px;padding:3px 9px;font-weight:600}
  .trk.tsel .lh{box-shadow:inset 2px 0 0 var(--accent)} .trk .lh{cursor:pointer}
  .song.msel,.ps.msel{background:rgba(245,165,36,.14)!important;box-shadow:inset 2px 0 0 var(--accent)} .folder.msel>.fhead .fh{background:rgba(245,165,36,.12)}
  .selbox{position:fixed;border:1px solid #f5a524;background:rgba(245,165,36,.08);pointer-events:none;z-index:9500;border-radius:2px}
  .xm .it kbd{margin-left:auto;padding-left:22px;color:var(--muted);font:inherit;font-size:11px;opacity:.8}
  .gridc{align-items:center;margin-left:6px;flex:none;width:max-content} .gridc select{flex:none;width:auto;min-width:96px;height:24px;background:transparent;border:0;color:var(--text);font:inherit;font-size:12px;padding:0 4px;border-radius:6px;cursor:pointer}
  .gridc select:hover{background:#1d2126;color:var(--text)} .gridc .ib2.on{color:var(--cyan)} .gridc .gbtn{height:24px;padding:0 8px;border-radius:6px;color:var(--text);font-size:12px;white-space:nowrap} .gridc .gbtn:hover{background:#1d2126} .gridc select[hidden]{display:none}
  .zoom button{width:22px;height:22px;border-radius:4px;color:var(--muted)} .zoom button:hover{background:var(--s2);color:var(--text)}
  .zoom input{-webkit-appearance:none;appearance:none;width:90px;height:14px;background:transparent;border:0;padding:0}
  .zoom input::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:#2a2f37}
  .zoom input::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#c9cdd4;margin-top:-3.5px}
  .btn.on{background:var(--s3);color:var(--text)}
  .vsep{width:1px;height:18px;background:var(--hair);margin:0 4px}

  .folder{position:relative;width:max-content;min-width:100%;border-bottom:1px solid #050607}
  .fhead{position:sticky;top:0;z-index:8;display:grid;grid-template-columns:var(--head) auto;height:40px;background:#101216;border-bottom:1px solid #050607}
  .fh{position:sticky;left:0;z-index:2;display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;background:var(--s2);border-right:1px solid #050607;cursor:pointer;white-space:nowrap;user-select:none}
  .fh:hover{background:var(--s3)}
  .folder.sel .fh{box-shadow:inset 3px 0 0 var(--accent)}
  .chev{width:12px;color:var(--faint);transition:transform .15s;font-size:10px;text-align:center}
  .folder.open .chev{transform:rotate(90deg)}
  .fh svg{width:15px;height:15px;flex:none}
  .fh .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .fh .num{font:11px var(--mono);color:var(--faint);min-width:26px;text-align:right}
  .fh .num.in{color:var(--accent)}
  .fh .chg{color:var(--cyan);font-size:12px}

  /* ======== calm pass: less on screen, more app-like ======== */

<script>

const SEC_C = {intro:'var(--s-intro)',verse:'var(--s-verse)',pre:'var(--s-pre)',chorus:'var(--s-chorus)',bridge:'var(--s-bridge)',outro:'var(--s-outro)',turn:'var(--s-turn)','count-in':'#ff9f0a'};
const cssVar = v => getComputedStyle(document.documentElement).getPropertyValue(v.slice(4,-1)).trim();
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ======================= SESSION DATA =======================
const songs = [

  { id:'glass', name:'Glasshouse', key:'F♯', col:'#22c3a6', trans:'stop',
    tmap:[{bar:1,bpm:92,sig:[4,4]},{bar:25,sig:[7,8]},{bar:27,sig:[4,4]},{bar:41,bpm:96},{bar:69,bpm:96},{bar:77,bpm:84,ramp:true}],
    secs:[['Intro','intro',8],['Verse 1','verse',16],['Turn','turn',2],['Chorus 1','chorus',14],['Verse 2','verse',16],['Chorus 2','chorus',12],['Outro (rit.)','outro',12]],
    tracks:['Click','Cues','Drums','Bass','Keys','Guitars','Strings','Guitar rig','Lights'] },
  { id:'low', name:'Low Tide', key:'D', col:'#6b7cff', trans:'auto', tmap:[{bar:1,bpm:76,sig:[6,8]}],
    secs:[['Intro','intro',8],['Verse','verse',16],['Chorus','chorus',16],['Verse','verse',16],['Chorus','chorus',16],['Outro','outro',12]],
    tracks:['Click','Cues','Drums','Bass','Keys','Pads','Guitar rig'] },
  { id:'sat', name:'Satellites', key:'E min', col:'#ff5fa2', trans:'segue', tmap:[{bar:1,bpm:140,sig:[4,4]},{bar:57,bpm:150}],
    secs:[['Intro','intro',8],['Verse','verse',16],['Chorus','chorus',16],['Verse','verse',16],['Chorus','chorus',16],['Bridge','bridge',8],['Chorus','chorus',16],['Outro','outro',4]],
    tracks:['Click','Cues','Drums','Bass','Guitars','Synth / Pads','Lights'] },
  { id:'copper', name:'Copper Sun', key:'B♭', col:'#a46bff', trans:'stop', tmap:[{bar:1,bpm:110,sig:[4,4]},{bar:33,sig:[3,4]},{bar:41,sig:[4,4]}],
    secs:[['Intro','intro',8],['Verse','verse',16],['Pre','pre',8],['Waltz','bridge',8],['Chorus','chorus',16],['Chorus','chorus',16],['Outro','outro',8]],
    tracks:['Click','Cues','Drums','Bass','Keys','Guitars','BGVs','Guitar rig','Lights'] },
  { id:'paper', name:'Paper Kings', key:'A', col:'#ff9f43', trans:'stop', tmap:[{bar:1,bpm:100,sig:[4,4]}],
    secs:[['Intro','intro',8],['Verse','verse',16],['Chorus','chorus',16],['Verse','verse',16],['Chorus','chorus',16],['Outro','outro',8]],
    tracks:['Click','Cues','Drums','Bass','Guitars','Guitar rig'] },
  { id:'under', name:'Undertow (alt intro)', key:'C♯ min', col:'#5aa9ff', trans:'stop', tmap:[{bar:1,bpm:72,sig:[4,4]},{bar:9,bpm:88,ramp:true}],
    secs:[['Rubato intro','intro',8],['Verse','verse',16],['Chorus','chorus',16],['Verse','verse',16],['Chorus','chorus',16],['Outro','outro',8]],
    tracks:['Click','Cues','Drums','Bass','Keys','Guitars','Lights'] },
  { id:'sound', name:'Soundcheck loop', key:'—', col:'#7d8696', trans:'stop', tmap:[{bar:1,bpm:120,sig:[4,4]}],
    secs:[['Loop','verse',16]], tracks:['Click','Drums','Bass','Keys'] },
];
let setOrder=['neon','glass','low','sat','copper'];
let setlists=[{id:'L1',name:'Full show',order:setOrder},{id:'L2',name:'Festival 30',order:['neon','glass','sat']},{id:'L3',name:'Acoustic',order:['low','paper']}], curSet='L1', setSeq=4;
const curSetObj=()=>setlists.find(x=>x.id===curSet)||setlists[0];
function syncSet(){ const c=curSetObj(); if(c) c.order=setOrder; }
function useSet(id){ if(playing&&id!==curSet){ toast('Stop playback first: the setlist can’t change while a song plays'); return false; } syncSet(); const was=curSet; curSet=id; setOrder=curSetObj().order; refresh(); if(perfOn) renderPerform(true); return true; }
const SETCOLS=['#f5a524','#7fe0cf','#bf5af2','#ff6b6b','#5ac8fa','#a3e635','#f472b6','#9aa0aa'];
const setCol=l=>l.col||SETCOLS[Math.max(0,setlists.indexOf(l))%SETCOLS.length];
function setlistCmd(cmd){ if(playing&&cmd!=='ren'){ toast('Stop playback first: the setlist can’t change while a song plays'); return; } const c=curSetObj(); syncSet();
  if(cmd==='new'){ const last=c, n={id:'L'+setSeq++,name:'Setlist '+(setlists.length+1),order:[],col:SETCOLS[setlists.length%SETCOLS.length]}; if(last&&last.sync) n.sync=JSON.parse(JSON.stringify(last.sync)); setlists.push(n); curSet=n.id; setOrder=n.order; refresh(); renameSet(); }
  else if(cmd==='dup'){ const n=JSON.parse(JSON.stringify(c)); n.id='L'+setSeq++; n.name=c.name+' copy'; setlists.push(n); curSet=n.id; setOrder=n.order; refresh(); renameSet(); }
  else if(cmd==='ren') renameSet();
  else if(cmd==='del'){ if(setlists.length<2){ toast('A library keeps at least one setlist'); return; } confirmBox(`Delete the setlist “${esc(c.name)}”?`,'The songs stay in the library. Only this running order is removed.','Delete setlist',()=>{ const i=setlists.indexOf(c); setlists.splice(i,1); curSet=setlists[Math.max(0,i-1)].id; setOrder=curSetObj().order; refresh(); toast(`Deleted setlist “${c.name}”`,()=>{ setlists.splice(i,0,c); useSet(c.id); }); }); } }
function setlistMenu(e){ const c=curSetObj(), r=e.currentTarget?e.currentTarget.getBoundingClientRect():null, at=r?{clientX:r.left,clientY:r.bottom+4}:e;
  ctxMenu(at,[{cap:'Setlists'},...setlists.map(l=>({label:l.name,key:(l.id===curSet?'✓  ':'')+l.order.length+(l.order.length===1?' song':' songs'),cur:l.id===curSet,icon:`<span class="cb" style="background:${setCol(l)}"></span>`,act:()=>useSet(l.id)})),'-',
    {label:'New setlist',icon:'＋',act:()=>setlistCmd('new')},{label:`Duplicate “${c.name}”`,icon:'⧉',act:()=>setlistCmd('dup')},{label:'Rename…',icon:'✎',act:()=>setlistCmd('ren')},
    {label:'Colour ▸',icon:'●',act:()=>swatchPop({left:at.clientX+150,right:at.clientX+150,top:at.clientY},setCol(c),col=>{ snap(); c.col=col; refresh(); })},
    {label:'Finish by…'+(c.finishBy?'  '+c.finishBy:''),icon:'⏱',act:()=>finishByBox()},{label:'Print setlist…',icon:'print',act:()=>printSetBox()},{label:'MIDI sync point…',icon:'⇄',act:()=>openSettings('midi')},
    {label:`Delete “${c.name}”…`,icon:'⌫',danger:true,dis:setlists.length<2,act:()=>setlistCmd('del')}]); }
const ROLE={'Click':'click','Cues':'cues','Drums':'drums','Bass':'bass','Keys':'keys','Guitars':'guitars','BGVs':'bgvs','Synth / Pads':'synth','FX / Risers':'fx','Pads':'synth','Strings':'strings'};
// ---------- outputs (6d): every track has its own output, set on its header or in the right panel ----------
// s.outs[track] = [1-based outputs]: one mono output or a stereo pair; [] = none. Tracks on the same output are summed.
// Output names: the interface's own (OUTS.names, from the app), renamed per device on this computer (Settings › Outputs).
const OUTS={device:'',count:0,names:[]};
let OUTREN={}; try{ OUTREN=JSON.parse(localStorage.getItem('setline.outNames')||'{}'); }catch(e){}
const outCount=()=>OUTS.count||8;
const outCustom=n=>((OUTREN[OUTS.device||'']||{})[n])||'';
const outName=n=>outCustom(n)||OUTS.names[n-1]||('Out '+n);
function setOutName(n,v){ const d=OUTS.device||''; const m=OUTREN[d]||(OUTREN[d]={}); if(v&&v.trim()) m[n]=v.trim(); else delete m[n]; try{ localStorage.setItem('setline.outNames',JSON.stringify(OUTREN)); }catch(e){} }
// A stereo pair's name: "FOH L" + "FOH R" -> "FOH L/R"; "Out 3" + "Out 4" -> "Out 3–4"; otherwise both names.
function pairName(a){ const x=outName(a), y=outName(a+1), lr=/^(.*?)\s*(L|Left)$/i, rr=/^(.*?)\s*(R|Right)$/i, nx=/^(.*?)\s*(\d+)$/;

const defVer=s=>versOf(s).find(v=>v.def)||versOf(s)[0];

const srcSecs=s=>(curVer(s).custom&&s.srcState?s.srcState.secs:s.secs)||[];
// Keeps a version's order in step with the source: new sections join where they are in the source (on), deleted ones go.
function normVer(s,v){ if(v.custom) return v; const secs=[...srcSecs(s)].sort((a,b)=>a.start-b.start), ids=new Set(secs.map(x=>x.id)); v.extras=v.extras||[];

function isFullVer(s,v){ if(!v||v.custom) return !v; normVer(s,v); const full=fullOrder(s); return v.order.length===full.length&&v.order.every((o,i)=>o.k==='sec'&&o.on&&o.id===full[i].id); }

function verParts(s,v){ normVer(s,v); const secs=srcSecs(s); return v.order.filter(o=>o.on).map(o=>{ if(o.k==='sec'){ const x=secs.find(q=>q.id===o.id); return x?{bar:x.start,bars:x.bars,secId:x.id,name:x.name,type:x.type}:null; }

const AFTER={stop:['','Stop'],segue:['↘','Segue'],auto:['⏵','Auto-next']};

// + Version: a copy of the version shown (its sections, order, version-only parts; a custom one its whole state)
function newVer(s,name){ const v0=curVer(s); let v;

function delVer(s,id){ const list=versOf(s); if(list.length<2) return; const v=list.find(x=>x.id===id); if(!v) return; if(s.ver===id) showVer(s,list.find(x=>x.id!==id).id,true);

// Version-only audio: one part of N bars (long enough for the file at the tempo where it plays) on its own track.
function addVerAudio(s,v,list,refs,copy){ if(!v||v.custom) return; normVer(s,v); s.vonly=s.vonly||{};

function selectAllIn(s){ const list=[]; s.tracks.forEach(t=>{ if(isAudio(s,t)) clipsOf(s,t).forEach(o=>list.push({kind:'audio',s,t,o})); else { const k=laneMenuFor(s,t); if(k==='cue') cuesOf(s).forEach(o=>list.push({kind:'cue',s,t,o})); else if(k) regList(s,t,k).forEach(o=>list.push({kind:k,s,t,o})); } });

// a drag on an empty part of the lanes: a box (selects what it touches); a plain click does click()

    const r=[Math.min(sx,m.clientX),Math.min(sy,m.clientY),Math.max(sx,m.clientX),Math.max(sy,m.clientY)]; box._r=r; Object.assign(box.style,{left:r[0]+'px',top:r[1]+'px',width:(r[2]-r[0])+'px',height:(r[3]-r[1])+'px'}); };
  const up=()=>{ document.removeEventListener('pointermove',move,true); document.removeEventListener('pointerup',up,true); if(!box){ click(); return; } const r=box._r; box.remove(); boxSelect(s,r,add); };
  document.addEventListener('pointermove',move,true); document.addEventListener('pointerup',up,true); }
function boxSelect(s,[x0,y0,x1,y1],add){ const found=add?selItems().filter(it=>it.s===s):[], seen=new Set(found.map(it=>mkey(it.kind,s.id,it.t,it.o.id)));

  document.querySelectorAll('canvas[data-song="'+s.id+'"][data-t]').forEach(cv=>{ const rc=cv.getBoundingClientRect(); if(rc.bottom<y0||rc.top>y1||rc.right<x0||rc.left>x1) return; const t=s.tracks[+cv.dataset.t]; if(t===undefined) return;

    const k=laneMenuFor(s,t); if(k==='cue') cuesOf(s).forEach(o=>{ const ct=cueT(s,o); if(ct>=tA-0.05&&ct<=tB) push('cue',t,o); });

// the selected items move together (by the dragged one's snapped amount); a step that would overlap

function groupCopy(){ const items=selItems(); if(items.length<2) return false; const t0=Math.min(...items.map(it=>itemSpan(it)[0])), t1=Math.max(...items.map(it=>itemSpan(it)[1]));

function groupDelete(){ const items=selItems(); if(items.length<2) return false; snap();

// ---------- glue (6c item 7): Ctrl/Cmd+J joins the selected clips on each track into one ----------
// Audio pieces of the file that follow on exactly (same gain, no fades between them) simply rejoin. Anything

function wireDrawer(s,t,cfg,evs,sel){

    mtl.ondragleave=()=>{ mtl.classList.remove('drop'); ghost.style.display='none'; };
    mtl.ondrop=ev=>{ ev.preventDefault(); mtl.classList.remove('drop'); const pid=ev.dataTransfer.getData('text/preset'); const pr=P(pid); if(!pr) return; const nb=nearestBeat(s,tAt(ev)); const e={id:evId++,bar:nb.bar,beat:nb.beat,anchor:'free'}; linkTo(e,pr); addEv(e); };
    mtl.querySelectorAll('.pin').forEach(pin=>pin.onpointerdown=pe=>{ pe.stopPropagation(); const e=s.midi[t].find(x=>x.id==pin.dataset.id); ed.sel=e.id; pin.setPointerCapture(pe.pointerId);

      drawer.querySelectorAll('.pi[data-pid]').forEach(it=>{ it.onclick=()=>{ const e={id:evId++,...where()}; linkTo(e,P(it.dataset.pid)); addEv(e); };

  } else if(ed.tab==='map'){

  }

const modal=$('modal');

// Adds imported stems to song s as audio tracks. list: [{role, info}], refs: {file path: session reference}.

  if(fails.length) toast(`MIDI sync: ${ok} sent, ${fails.length} failed (${fails.join('; ')})`);
  else if(!onlyPorts){ const b=$('syncBtn'), r=b&&!b.hidden?b.getBoundingClientRect():null; if(r) ctxMenu({clientX:r.left,clientY:r.bottom+6},[{cap:'Sent to all devices at once'},...SYNCED.list.map(x=>({label:x.label,icon:x.ok?'✓':'✕',act:()=>{}})),{cap:'Songs take over from here.'}]); else toast(`MIDI synced: ${ok} device${ok===1?'':'s'} ✓`); }

// ---------- patch sheet (Settings › Outputs): every output and the tracks on it, as a one-or-more page PDF ----------
function patchSheetLines(){ const by=new Map(), none=new Map(); const add=(m,k,t,s)=>{ if(!m.has(k)) m.set(k,new Map()); const x=m.get(k); x.set(t,(x.get(t)||new Set()).add(s.name)); };
  songs.forEach(s=>s.tracks.forEach(t=>{ if(isMidiTrack(s,t)) return; const o=outsOf(s,t); if(o.length) add(by,JSON.stringify(o),t,s); else add(none,'[]',t,s); }));
  const keys=[...by.keys()].sort((a,b)=>JSON.parse(a)[0]-JSON.parse(b)[0]||JSON.parse(a).length-JSON.parse(b).length), lines=[];
  keys.forEach(k=>{ const o=JSON.parse(k); lines.push({b:true,t:`${o.length===2?`Out ${o[0]}–${o[1]}`:`Out ${o[0]}`}   ${outLabel(o)}`}); [...by.get(k).entries()].sort((a,b)=>a[0].localeCompare(b[0])).forEach(([t,ss])=>lines.push({t:`      ${t}${ss.size<songs.length?`   (${ss.size} song${ss.size>1?'s':''})`:''}`})); });
  if(none.size){ lines.push({b:true,t:'No output'}); [...none.get('[]').keys()].forEach(t=>lines.push({t:'      '+t})); }
  const midi=[]; songs.forEach(s=>s.tracks.forEach(t=>{ if(isMidiTrack(s,t)){ const k=`${t} · ${s.midiCfg[t].port} · Ch ${s.midiCfg[t].ch}`; if(!midi.includes(k)) midi.push(k); } }));
  if(midi.length){ lines.push({t:''},{b:true,t:'MIDI'}); midi.forEach(k=>lines.push({t:'      '+k})); }
  return lines; }
function pdfOf(title,sub,lines){ const W1252={'–':150,'—':151,'·':183,'’':146,'‘':145,'“':147,'”':148,'…':133,'•':149};
  const enc=s=>[...String(s)].map(ch=>{ const c=ch.charCodeAt(0); const v=W1252[ch]||(c<256?c:63); return v===40||v===41||v===92?'\\'+String.fromCharCode(v):String.fromCharCode(v); }).join('');
  const per=46, pages=[]; for(let i=0;i<Math.max(1,lines.length);i+=per) pages.push(lines.slice(i,i+per));
  const objs=[], add=s=>{ objs.push(s); return objs.length; };
  const font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'), bold=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const pagesId=objs.length+pages.length*2+1; const kids=[];
  pages.forEach((pl,pi)=>{ let y=800; let c=`BT /F2 18 Tf 50 ${y} Td (${enc(title)}) Tj ET\nBT /F1 10 Tf 50 ${y-18} Td (${enc(sub+(pages.length>1?`   ·   page ${pi+1} of ${pages.length}`:''))}) Tj ET\n`; y-=52;
    pl.forEach(l=>{ c+=`BT /${l.b?'F2':'F1'} ${l.b?12:11} Tf 50 ${y} Td (${enc(l.t)}) Tj ET\n`; y-=l.b?17:15; });
    const cs=add(`<< /Length ${c.length} >>\nstream\n${c}endstream`); kids.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${font} 0 R /F2 ${bold} 0 R >> >> /Contents ${cs} 0 R >>`)); });
  add(`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`); const cat=add(`<< /Type /Catalog /Pages ${objs.length} 0 R >>`);
  let out='%PDF-1.4\n', offs=[]; objs.forEach((o,i)=>{ offs.push(out.length); out+=`${i+1} 0 obj\n${o}\nendobj\n`; });
  const xref=out.length; out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  return out; }
async function exportPatchSheet(to){ const show=$('crumbAll').textContent||'Show', d=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
  const pdf=pdfOf(`${show} — patch sheet`,`${OUTS.device||'Audio interface'} · ${d}`,patchSheetLines()), b64=btoa(pdf);
  if(!NATIVE||!window.SLE){ toast('In the app this saves the patch sheet as a PDF'); return {pdf}; }
  const r=await ncall('savePdf',{name:show+' patch sheet',base64:b64,to:to||''}); if(r&&r.path) toast('Patch sheet saved: '+r.path); else if(r&&r.error) toast(r.error); return r; }

document.addEventListener('keydown',e=>{ if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.metaKey||e.ctrlKey){ const k=e.key.toLowerCase(); if(k===','){ e.preventDefault(); openSettings(); return; } if(k==='s'||k==='o'){ e.preventDefault(); toast('Nothing to save: the library saves every change by itself'); return; } if(k==='n'){ e.preventDefault(); setlistCmd('new'); return; } if(k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; } if(k==='y'){ e.preventDefault(); redo(); return; }
    if(k==='a'&&selId&&!ed.song){ e.preventDefault(); const s=songs.find(x=>x.id===selId); if(s) selectAllIn(s); return; }
    if(k==='j'){ e.preventDefault(); glueSel(); return; }

  if(!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.shiftKey){ const k=e.key.toLowerCase(), act={n:'nextSong',p:'prevSong',v:'nextVersion',l:'exitLoop',m:'syncMidi'}[k]; if(act&&!(k==='v'&&selClip)){ e.preventDefault(); SLActions.run(act); return; } }

  if(!e.metaKey&&!e.ctrlKey&&!e.altKey){ const k=e.key.toLowerCase(); if(k==='c') setLoop(!loopOn); if(k==='k') $('clickBtn').click(); if(e.key==='='||e.key==='+') $('zIn').click(); if(e.key==='-') $('zOut').click(); } if(e.key==='[') setPanel('L',!isOpen('L')); if(e.key===']') setPanel('R',!isOpen('R'));
  if(tsel && !$('tpop')?.contains(document.activeElement)){ const t=tpopTarget(); if(t){ const {s,e:ev}=t, first=s.tmap.indexOf(ev)===0;

    if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!first){ e.preventDefault(); const n=ev.bar+(e.key==='ArrowRight'?1:-1); if(n>1&&n<=s.total&&!s.tmap.some(o=>o!==ev&&o.bar===n)){ ev.bar=n; buildBars(s); tsel={song:s.id,i:s.tmap.indexOf(ev)}; tempoRefresh(); setTimeout(()=>openTpop(),20); } return; }
