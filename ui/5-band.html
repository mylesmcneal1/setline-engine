<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>set.Line — Band</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./src/fonts.css"><script type="module" src="./src/bridge.ts"></script>
<!-- Band (6d): one place for the band's screens, replacing "Satellite" and "Users & Canvases". This phase is the
     page shell: the screens, a layout preset per screen, what each one shows, what it may control, its name and colour.
     It reuses the screens' saved data (shared.js: setline.canvases.v2); the per-screen canvas editor is behind
     "Customize layout…" (4-users.html). No networking yet: that's the satellite phase. -->
<style>
  :root{--bg:#0b0b0c;--s1:#141415;--s2:#1c1c1e;--s3:#2a2a2e;--hair:#26262a;--line:#0c0c0d;--text:#f2f2f4;--muted:#8e8e96;--faint:#5a5a62;--accent:#ff9f0a;--blue:#0a84ff;--green:#30d158;--red:#ff453a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:13px/1.35 Inter,system-ui,sans-serif;display:grid;grid-template-rows:52px 1fr;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit;color:var(--text);background:var(--s3);border:0;border-radius:6px;padding:4px 9px;outline:none}
  .top{display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--s1)}
  .tabs{display:flex;background:var(--s3);border-radius:8px;padding:2px;margin-left:8px}
  .tabs a{padding:5px 13px;border-radius:6px;color:#c9c9cf;font-weight:500;text-decoration:none}
  .tabs a.on{background:#48484e;color:#fff}
  .top .sp{margin-left:auto;color:var(--muted);font-size:12px}
  .main{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;min-height:0}
  .left{background:var(--s1);border-right:1px solid var(--line);padding:10px 8px;overflow:auto}
  .lh{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 10px;font-weight:600}
  .lh button{color:var(--muted);font-weight:400}
  .scr{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:7px;margin-bottom:1px;cursor:pointer}
  .scr:hover{background:#1f1f22} .scr.on{background:var(--s3)}
  .av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#111;flex:none}
  .scr .t{flex:1;min-width:0} .scr .tr{font-size:11px;color:var(--muted)}
  .join{margin:18px 8px 0;padding:12px;background:var(--s2);border-radius:10px;font-size:12px;color:var(--muted);line-height:1.5}
  .ctr{padding:18px 22px;overflow:auto}
  .ctr h1{font-size:20px} .ctr p.d{color:var(--muted);margin-top:2px}
  .layouts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
  .lay{background:var(--s2);border-radius:10px;padding:10px;border:2px solid transparent;cursor:pointer;text-align:left}
  .lay:hover{border-color:#3a3a40} .lay.on{border-color:var(--blue)}
  .lay .pv{height:110px;border-radius:6px;background:#000;margin-bottom:8px;position:relative;overflow:hidden}
  .lay b{font-size:13px} .lay small{display:block;color:var(--muted);font-size:11px}
  .right{background:var(--s1);border-left:1px solid var(--line);padding:14px;overflow:auto}
  .card{background:var(--s2);border-radius:10px;padding:11px 12px;margin-bottom:10px}
  .card h3{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}
  .f{display:flex;align-items:center;justify-content:space-between;padding:5px 0;gap:10px}
  .f span:first-child{color:#c9c9cf}
  .tog{width:32px;height:19px;border-radius:10px;background:var(--green);position:relative;flex:none}
  .tog::after{content:"";position:absolute;right:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff}
  .tog.off{background:#48484e} .tog.off::after{right:auto;left:2px}
  .sw{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:170px} .sw i{width:16px;height:16px;border-radius:50%;display:block;cursor:pointer} .sw i.on{box-shadow:0 0 0 2px var(--s2),0 0 0 4px #fff}
  .btn{background:var(--s3);border-radius:7px;padding:6px 12px;color:#e4e4e8;font-size:12px;font-weight:500}
  .btn:hover{background:#38383e}
  .note{color:var(--muted);font-size:11.5px;line-height:1.5;margin-top:14px}
</style>
<script src="ui.js"></script>
</head>
<body>
<header class="top">
  <img src="brand/setline-wordmark-dark-bg.svg" alt="set.Line" style="display:block;height:21px;width:auto" draggable="false">
  <nav class="tabs"><a href="1-arrange.html">Show</a><a href="3-satellite.html?mac" title="This computer’s own screen, full window">Perform</a><a class="on" href="5-band.html">Band</a></nav>
  <span class="sp">Band screens join on this network · coming in the satellite phase</span>
</header>
<div class="main">
  <aside class="left">
    <div class="lh"><span>Band screens</span><button id="addScr">＋ Add</button></div>
    <div id="screens"></div>
    <div class="join">Band members will join at <b style="color:#fff">setline.local</b> or by scanning the code on this computer’s screen.</div>
  </aside>
  <section class="ctr" id="ctr"></section>
  <aside class="right" id="right"></aside>
</div>
<script src="shared.js"></script>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAL=['#ff6b6b','#ff9f43','#ffd60a','#30d158','#22c3a6','#64d2ff','#5aa9ff','#5e5ce6','#bf5af2','#ff375f','#ac8e68','#c9cdd4'];
// Layout presets (a starting canvas; "Customize layout…" edits it widget by widget).
const PRESETS={
  count:{n:'Count & sections',d:'Bars left, beat lights, next section',
    land:[['song',1,1,8,1],['timers',9,1,4,1],['timeline',1,2,12,1],['countdown',1,3,7,4],['beats',8,3,5,2],['next',8,5,5,2],['notes',1,7,9,2],['ready',10,7,3,2]],
    port:[['song',1,1,6,1],['countdown',1,2,6,3],['beats',1,5,6,1],['next',1,6,6,1],['notes',1,7,6,3],['ready',1,10,6,1]]},
  setlist:{n:'Setlist',d:'Song order, what’s next, transitions',
    land:[['song',1,1,8,1],['timers',9,1,4,1],['setlist',1,2,7,7],['next',8,2,5,2],['countdown',8,4,5,3],['ready',8,7,5,2]],
    port:[['song',1,1,6,1],['setlist',1,2,6,6],['next',1,8,6,1],['countdown',1,9,6,2]]},
  controls:{n:'Controls',d:'Big buttons: play, next, jump',
    land:[['song',1,1,8,1],['timers',9,1,4,1],['timeline',1,2,12,2],['play',1,4,4,3],['nextbtn',5,4,4,3],['exitloop',9,4,4,3],['prevbtn',1,7,4,2],['jumpmode',5,7,8,2]],
    port:[['song',1,1,6,1],['timeline',1,2,6,2],['play',1,4,6,2],['nextbtn',1,6,3,2],['prevbtn',4,6,3,2],['exitloop',1,8,6,2],['jumpmode',1,10,6,1]]},
};
const SHOWN=[['song','Song name, BPM, meter'],['timeline','Section timeline'],['notes','Notes for this player'],['patches','Patch names (MIDI tracks)']];
const CONTROL=[['start','Play / stop'],['jump','Jump to section'],['loop','Exit loop'],['song','Change songs'],['mute','Mute stems'],['resend','Resend MIDI']];
let USERS=SL.load().filter(Boolean), cur=(USERS.find(u=>u.id!=='mac')||USERS[0]||{}).id;
const me=()=>USERS.find(u=>u.id===cur);
const save=()=>{ SL.save(USERS); };
const shownOf=u=>({song:1,timeline:1,notes:u.notes?1:0,patches:0,...(u.shown||{})});
const presetPv={count:'<div style="position:absolute;left:8px;right:8px;top:8px;height:22px;display:flex;gap:2px"><i style="flex:1;background:#6b7cff"></i><i style="flex:2;background:#22c3a6"></i><i style="flex:2;background:#f5a524"></i><i style="flex:1;background:#ff5fa2"></i></div><div style="position:absolute;left:8px;top:38px;width:60%;height:40px;background:#22c3a6;border-radius:4px"></div><div style="position:absolute;right:10px;top:42px;color:#fff;font:700 26px Inter">8</div>',
  setlist:'<div style="position:absolute;left:8px;top:8px;right:8px;color:#fff;font:600 12px Inter">1 Neon Rivers<br>2 Glasshouse<br><span style="color:#888">3 Low Tide<br>4 Satellites</span></div>',
  controls:'<div style="position:absolute;inset:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px"><i style="background:#1e3a26;border-radius:4px"></i><i style="background:#3a2a10;border-radius:4px"></i><i style="background:#22223a;border-radius:4px"></i><i style="background:#3a1e2a;border-radius:4px"></i></div>'};
function render(){
  $('screens').innerHTML=USERS.filter(u=>u.id!=='mac').map(u=>`<div class="scr ${u.id===cur?'on':''}" data-id="${esc(u.id)}"><span class="av" style="background:${esc(u.col)}">${esc(u.short||u.name.slice(0,2).toUpperCase())}</span><span class="t">${esc(u.name)}<br><span class="tr">${(u.devices||[]).length?esc(u.devices[0][0]):'no device yet'}</span></span></div>`).join('');
  document.querySelectorAll('.scr').forEach(r=>r.onclick=()=>{ cur=r.dataset.id; render(); });
  const u=me(); if(!u){ $('ctr').innerHTML='<p class="d">No band screens yet. Add one on the left.</p>'; $('right').innerHTML=''; return; }
  const sh=shownOf(u);
  $('ctr').innerHTML=`<h1>${esc(u.name)}</h1><p class="d">Pick a layout. You can still move things around on the device itself.</p>
    <div class="layouts">${Object.entries(PRESETS).map(([k,p])=>`<button class="lay ${u.preset===k?'on':''}" data-k="${k}"><div class="pv">${presetPv[k]}</div><b>${p.n}</b><small>${p.d}</small></button>`).join('')}</div>
    <div class="card" style="margin-top:18px"><h3>Shown on this screen</h3>${SHOWN.map(([k,l])=>`<div class="f"><span>${l}</span><button class="tog ${sh[k]?'':'off'}" data-show="${k}"></button></div>`).join('')}</div>
    <button class="btn" id="custom">Customize layout…</button>
    <p class="note">The layout and these settings are saved on this computer and sent to the screen when it joins (satellite phase).</p>`;
  $('right').innerHTML=`<div class="card"><h3>Can control</h3>${CONTROL.map(([k,l])=>`<div class="f"><span>${l}</span><button class="tog ${u.perms&&u.perms[k]?'':'off'}" data-perm="${k}"></button></div>`).join('')}</div>
    <div class="card"><h3>Device</h3><div class="f"><span>Name</span><input id="nm" value="${esc(u.name)}" style="width:150px"></div>
      <div class="f"><span>Colour</span><div class="sw">${PAL.map(c=>`<i data-c="${c}" style="background:${c}" class="${String(u.col).toLowerCase()===c?'on':''}"></i>`).join('')}</div></div>
      <div class="f"><span>Keep screen awake</span><button class="tog ${u.awake===false?'off':''}" id="awake"></button></div></div>
    <button class="btn" id="del" style="color:var(--red);background:none;padding:6px 0">Remove this screen…</button>`;
  document.querySelectorAll('.lay').forEach(b=>b.onclick=()=>{ const p=PRESETS[b.dataset.k]; u.preset=b.dataset.k; u.w=SL.clone(u.orient==='port'?p.port:p.land); if(u.orient==='port'){ u.cols=6; u.rows=10; } else if(u.orient!=='mac'){ u.cols=12; u.rows=8; } u.edited=false; save(); render(); });
  document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{ const s=shownOf(u); s[b.dataset.show]=s[b.dataset.show]?0:1; u.shown=s; save(); render(); });
  document.querySelectorAll('[data-perm]').forEach(b=>b.onclick=()=>{ u.perms=u.perms||{}; u.perms[b.dataset.perm]=u.perms[b.dataset.perm]?0:1; save(); render(); });
  $('nm').onchange=e=>{ const v=e.target.value.trim(); if(v){ u.name=v; u.short=v.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); save(); render(); } };
  document.querySelectorAll('.sw i').forEach(i=>i.onclick=()=>{ u.col=i.dataset.c; save(); render(); });
  $('awake').onclick=()=>{ u.awake=u.awake===false; save(); render(); };
  $('custom').onclick=()=>{ location.href='4-users.html?u='+encodeURIComponent(u.id); };
  $('del').onclick=()=>{ if(!confirm('Remove “'+u.name+'”?')) return; USERS=USERS.filter(x=>x!==u); cur=(USERS.find(x=>x.id!=='mac')||{}).id; save(); render(); };
}
$('addScr').onclick=()=>{ const id='u'+Date.now().toString(36), n=USERS.filter(u=>u.id!=='mac').length+1, p=PRESETS.count;
  USERS.push({id,name:'Screen '+n,short:'S'+n,col:PAL[n%PAL.length],notes:null,orient:'land',cols:12,rows:8,perms:{start:0,jump:0,loop:0,song:0,mute:0,resend:0,lock:0,layout:1},devices:[],preset:'count',w:SL.clone(p.land)}); cur=id; save(); render(); };
window.addEventListener('storage',e=>{ if(e.key===SL.KEY){ USERS=SL.load().filter(Boolean); render(); } });
render();
</script>
</body>
</html>
