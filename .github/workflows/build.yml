name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-15
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: windows
            os: windows-latest
            cmake_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The set.Line app builds its web UI (ui/) with Vite during the CMake build.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Windows: the app links WebView2 statically; JUCE finds the NuGet package in the user's folder.
      - name: WebView2 SDK (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        # Same package and folder as JUCE's Install-Package instructions, fetched straight from nuget.org
        # (PowerShell's NuGet provider isn't reliable on the hosted runners).
        run: |
          $v = "1.0.3485.44"
          $dir = "$env:USERPROFILE\AppData\Local\PackageManagement\NuGet\Packages\Microsoft.Web.WebView2.$v"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$v" -OutFile webview2.zip
          Expand-Archive webview2.zip -DestinationPath $dir -Force
          Get-ChildItem "$dir\build\native\x64" | Select-Object Name

      # Pinned downloads, kept between runs: the ONNX Runtime package (CMake checks nuget.org's SHA-512 on every
      # configure) and the Kokoro model, voices and dictionaries (the app checks each file's SHA-256).
      - name: Cache pinned downloads
        uses: actions/cache@v6
        with:
          path: |
            dl
            models
          key: voices-ort-1.19.2-kokoro-v1.0-1939ad2a-misaki-fba12365-${{ runner.os }}

      - name: Configure
        # Every build is version 0.1.<run number> ("Beta 0.1.<n>" on the loading window and in About).
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSETLINE_BUILD_NUMBER=${{ github.run_number }} -DSETLINE_DOWNLOADS_DIR="${{ github.workspace }}/dl" ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Core test (no JUCE)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Band screens logic test (clock sync, Until next change, curfew, permissions)
        run: node tests/band/logic.test.mjs

      - name: UI pages parse (inline scripts)
        run: node tests/ui-syntax.mjs

      - name: Modeler MIDI (Quad Cortex / Axe-Fx III messages, preset fields, lane drag and drop)
        run: node tests/modeler.test.mjs

      # 8a: the main views in headless Chrome at 1280x800 (the band's MacBook) and 1440x900; fails when the top bar
      # or the right panel overflows, a button wraps or a menu item has no text. Screenshots are kept as an artifact.
      - name: UI layout at 1280x800
        run: node tests/ui-layout.mjs --shots ui-layout-shots

      - name: Upload UI layout screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-layout-${{ matrix.name }}
          path: ui-layout-shots
          if-no-files-found: ignore

      - name: Find binaries (macOS)
        if: matrix.name == 'macos'
        run: |
          BIN=$(find build -type f -name setline-spike -perm -u+x | head -n 1)
          APP=$(find build -type d -name "set.Line.app" | head -n 1)
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "APP=$APP" >> "$GITHUB_ENV"
          lipo -info "$BIN"
          otool -l "$BIN" | grep -A3 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | head -n 8
          lipo -info "$APP/Contents/MacOS/set.Line"
          lipo -info "$APP/Contents/Frameworks/libonnxruntime.1.19.2.dylib"
          otool -l "$APP/Contents/Frameworks/libonnxruntime.1.19.2.dylib" | grep -A3 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | head -n 8
          otool -l "$APP/Contents/MacOS/set.Line" | grep -A3 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | head -n 4

      - name: Show machine guard (Intel + macOS 12 must stay supported)
        if: matrix.name == 'macos'
        run: |
          # The band's show machine is a 2015 Intel MacBook Pro on macOS 12.7. Every Mac binary must keep x86_64 and a
          # minimum macOS of 12 or lower; this step fails the build otherwise.
          fail=0
          for f in "$BIN" "$APP/Contents/MacOS/set.Line" "$APP/Contents/Frameworks/libonnxruntime.1.19.2.dylib"; do
            lipo -archs "$f" | grep -qw x86_64 || { echo "::error::$f has no Intel (x86_64) slice"; fail=1; }
            for a in $(lipo -archs "$f"); do
              v=$(otool -arch "$a" -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit} /LC_VERSION_MIN_MACOSX/{m=1} m&&/version/{print $2; exit}')
              major=${v%%.*}
              echo "$f [$a]: minimum macOS $v"
              if [ -z "$v" ] || [ "$major" -gt 12 ]; then echo "::error::$f [$a] needs macOS $v (must be 12 or lower)"; fail=1; fi
            done
          done
          exit $fail

      - name: Find binaries (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          echo "BIN=$(find build -type f -name setline-spike.exe | head -n 1)" >> "$GITHUB_ENV"
          echo "APP=$(find build -type f -name set.Line.exe | head -n 1)" >> "$GITHUB_ENV"

      - name: App self-test and render smoke test
        shell: bash
        run: |
          "$BIN" --selftest
          "$BIN" --make-test ci-song --stems 2 --seconds 20
          "$BIN" --render ci-song --out ci-render.wav

      - name: Spoken cues (system voices) test
        shell: bash
        run: |
          if [ -d "$APP/Contents/MacOS" ]; then EXE="$APP/Contents/MacOS/set.Line"; else EXE="$APP"; fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            # under lldb: a crash prints every thread's backtrace
            SETLINE_SPEECH_DEBUG=1 lldb --batch -o run -k "thread backtrace all" -k "quit 1" -- "$EXE" --speech-test speech-test || status=$?
          else
            "$EXE" --speech-test speech-test || status=$?
          fi
          cat speech-test/speech-test.txt || true
          grep -q "SPEECH OK" speech-test/speech-test.txt

      - name: Ableton import test (synthetic .als projects)
        shell: bash
        run: |
          if [ -d "$APP/Contents/MacOS" ]; then EXE="$APP/Contents/MacOS/set.Line"; else EXE="$APP"; fi
          "$EXE" --ableton-test ableton-test | tee ableton-test.txt
          grep -q "ABLETON OK" ableton-test.txt

      # 8d: in-app updates on fake apps: version compare, SHA-256 verify (good / damaged), unpack next to the app,
      # install (the old one kept as "(previous)"), roll back and forward again (the real swap scripts)
      - name: In-app update test
        shell: bash
        run: |
          if [ -d "$APP/Contents/MacOS" ]; then EXE="$APP/Contents/MacOS/set.Line"; else EXE="$APP"; fi
          "$EXE" --update-test update-test | tee update-test.txt
          grep -q "UPDATE OK" update-test.txt

      # Built-in Kokoro voices: ONNX Runtime 1.19.2 loaded from the app, the pinned model downloaded (or taken
      # from the cache) and verified, every English voice saying the common cue words, cache behaviour, timing.
      - name: Kokoro voices test
        shell: bash
        env:
          SETLINE_MODELS_DIR: ${{ github.workspace }}/models
        run: |
          if [ -d "$APP/Contents/MacOS" ]; then EXE="$APP/Contents/MacOS/set.Line"; else EXE="$APP"; fi
          "$EXE" --kokoro-test kokoro-test || status=$?
          cat kokoro-test/kokoro-test.txt || true
          grep -q "KOKORO OK" kokoro-test/kokoro-test.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kokoro-samples-${{ matrix.name }}
          path: |
            kokoro-test/*.wav
            kokoro-test/kokoro-test.txt

      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: |
          mkdir -p dist
          cp "$BIN" dist/setline-spike
          cp README.md dist/
          # tar keeps the executable bit (a plain artifact zip would lose it)
          tar -czf setline-spike-macos.tar.gz -C dist .
          # the app bundle: ditto keeps the bundle structure, permissions and attributes
          ditto -c -k --sequesterRsrc --keepParent "$APP" set.Line-macos.zip

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "$BIN" dist/
          cp README.md dist/
          7z a setline-spike-windows.zip ./dist/*
          mkdir -p dist-app
          cp "$APP" dist-app/
          cp "$(dirname "$APP")/onnxruntime.dll" dist-app/
          cp -r "$(dirname "$APP")/licenses" dist-app/
          cp THIRD_PARTY.md dist-app/
          cp docs/building-the-app.md dist-app/
          7z a set.Line-windows.zip ./dist-app/*

      - uses: actions/upload-artifact@v7
        with:
          name: setline-spike-${{ matrix.name }}
          path: setline-spike-${{ matrix.name }}.*

      - uses: actions/upload-artifact@v7
        with:
          name: set.Line-${{ matrix.name }}
          path: set.Line-${{ matrix.name }}.zip

  # Shows move between Windows and Mac (tests/xplat): each system makes a show (stems with awkward names, clips,
  # click, cues, MIDI, versions) and renders it ...
  xplat-make:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-15
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: app
          pattern: "set*-${{ matrix.name }}"
          merge-multiple: true

      - name: Unpack
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = macos ]; then
            ditto -x -k app/set.Line-macos.zip app/x
            tar -xzf app/setline-spike-macos.tar.gz -C app/x
            echo "EXE=$PWD/app/x/set.Line.app/Contents/MacOS/set.Line" >> "$GITHUB_ENV"
            echo "SPIKE=$PWD/app/x/setline-spike" >> "$GITHUB_ENV"
          else
            7z x -y -oapp/x app/set.Line-windows.zip > /dev/null
            7z x -y -oapp/x app/setline-spike-windows.zip > /dev/null
            echo "EXE=$PWD/app/x/set.Line.exe" >> "$GITHUB_ENV"
            echo "SPIKE=$PWD/app/x/$(cd app/x && find . -name setline-spike.exe | head -n 1)" >> "$GITHUB_ENV"
          fi

      - name: Make a show on ${{ matrix.name }}
        shell: bash
        run: bash tests/xplat/run.sh make "$EXE" "$SPIKE" xplat-work

      - uses: actions/upload-artifact@v7
        with:
          name: xshow-${{ matrix.name }}
          path: xplat-work/show

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xplat-make-log-${{ matrix.name }}
          path: |
            xplat-work/made.json
            xplat-work/app-make.log
          if-no-files-found: ignore

  # ... and the OTHER system opens it, finds every file, renders it and compares.
  xplat-check:
    needs: xplat-make
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-15
            from: windows
          - name: windows
            os: windows-latest
            from: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: app
          pattern: "set*-${{ matrix.name }}"
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: xshow-${{ matrix.from }}
          path: xplat-work/show

      - name: Unpack
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = macos ]; then
            ditto -x -k app/set.Line-macos.zip app/x
            tar -xzf app/setline-spike-macos.tar.gz -C app/x
            echo "EXE=$PWD/app/x/set.Line.app/Contents/MacOS/set.Line" >> "$GITHUB_ENV"
            echo "SPIKE=$PWD/app/x/setline-spike" >> "$GITHUB_ENV"
          else
            7z x -y -oapp/x app/set.Line-windows.zip > /dev/null
            7z x -y -oapp/x app/setline-spike-windows.zip > /dev/null
            echo "EXE=$PWD/app/x/set.Line.exe" >> "$GITHUB_ENV"
            echo "SPIKE=$PWD/app/x/$(cd app/x && find . -name setline-spike.exe | head -n 1)" >> "$GITHUB_ENV"
          fi

      - name: Open the ${{ matrix.from }} show on ${{ matrix.name }}
        shell: bash
        run: bash tests/xplat/run.sh check "$EXE" xplat-work

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xplat-check-log-${{ matrix.name }}
          path: |
            xplat-work/checked.json
            xplat-work/app-check.log
          if-no-files-found: ignore

  # After every green build on main: the "latest" prerelease, replaced, with the Mac and Windows builds, the Mac
  # update scripts, a SHA-256 checksum file and the commits since the previous "latest" (docs/remote-mac-testing.md).
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: set*
          merge-multiple: true

      - name: Publish "latest" (0.1.${{ github.run_number }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="0.1.${{ github.run_number }}"
          cp scripts/setline-update.sh scripts/install-update-command.sh dist/
          cd dist
          files="set.Line-macos.zip setline-spike-macos.tar.gz set.Line-windows.zip setline-spike-windows.zip setline-update.sh install-update-command.sh"
          ls -la $files
          sha256sum $files > SHA256SUMS.txt
          cat SHA256SUMS.txt
          prev="$(git rev-list -n 1 latest 2>/dev/null || true)" # the commit the previous "latest" was built from
          {
            echo "set.Line $V (beta), built from ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d)."
            echo
            if [ -n "$prev" ] && [ "$prev" != "$GITHUB_SHA" ]; then
              echo "Changes since the previous \"latest\":"
              git log --no-merges --format='- %s (%h)' "$prev..$GITHUB_SHA"
            else
              echo "Recent changes:"
              git log --no-merges --format='- %s (%h)' -n 15 "$GITHUB_SHA"
            fi
            echo
            echo "Mac: run setline-update. Checksums: SHA256SUMS.txt."
          } > notes.md
          cat notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --prerelease --target "$GITHUB_SHA" --title "set.Line $V" --notes-file notes.md $files SHA256SUMS.txt

  # The Mac update command against the release just published, installing into a temp folder (no questions).
  mac-update:
    needs: release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: setline-update (install, spike, second install, rollback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/Applications"; S="$RUNNER_TEMP/setline-spike"
          bash scripts/setline-update.sh --check --repo "$GITHUB_REPOSITORY"
          bash scripts/setline-update.sh --yes --dest "$D" --spike --spike-dest "$S" --repo "$GITHUB_REPOSITORY"
          v="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$D/set.Line.app/Contents/Info.plist")"
          echo "installed $v"
          test "$v" = "0.1.${{ github.run_number }}"
          test -f "$D/set.Line.app/Contents/Resources/setline.icns"
          test -z "$(xattr -p com.apple.quarantine "$D/set.Line.app" 2>/dev/null || true)"
          "$S/setline-spike" --selftest | tail -n 1
          bash scripts/setline-update.sh --yes --dest "$D" --repo "$GITHUB_REPOSITORY"
          test -d "$D/set.Line (previous).app"
          bash scripts/setline-update.sh --rollback --yes --dest "$D"
          test -d "$D/set.Line.app" && test -d "$D/set.Line (previous).app"
          echo "MAC UPDATE OK"
